<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CINEMALAND — Agence de voyages</title>
<style>
:root{--or:#efc878;--fond:#1b100d;--papier:#fff0c9}*{box-sizing:border-box}body{margin:0;background:#130b09;color:var(--papier);font-family:Georgia,serif}button,a{font:inherit}button{cursor:pointer}.agence{width:min(100vw,1536px);aspect-ratio:3/2;margin:0 auto;position:relative;background:#301c12 url('agence-voyages.png') center/100% 100% no-repeat;box-shadow:0 0 40px #000}.carte-clic{position:absolute;left:24%;top:2.5%;width:52%;height:42%;border:0;background:transparent;color:transparent;font-size:0;cursor:pointer}.carte-clic:hover,.carte-clic:focus-visible{outline:4px solid #f7d484;outline-offset:-4px;box-shadow:inset 0 0 35px #ffe8a855}.badge{position:absolute;top:45%;left:39%;width:30%;text-align:center;background:#271308eb;border:2px solid #dfae5a;padding:10px;color:#ffe4aa;font-size:clamp(10px,1.6vw,23px);pointer-events:none;box-shadow:0 4px 15px #000a}.sortie{position:absolute;right:0;top:7%;width:16.8%;height:70%;z-index:5;background:transparent;border:0;color:transparent;font-size:0;text-decoration:none;cursor:pointer}
.sortie:hover,.sortie:focus-visible{filter:brightness(1.2);outline:2px solid #ffe4a5}.ecran{display:none;position:fixed;inset:0;z-index:20;overflow:auto;background:radial-gradient(ellipse at top,#5a2b18,#170b09 75%);padding:20px clamp(12px,3vw,45px) 50px}.ecran.ouvert{display:block}.barre{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:0 auto 14px;max-width:1500px}.barre h1{font-size:clamp(23px,3vw,38px);margin:0;color:#f7d493}.boutons{display:flex;gap:10px}.boutons button{background:#39180f;color:#ffe2a2;border:1px solid #d2a55d;padding:9px 14px;border-radius:4px}.contenu{max-width:1500px;margin:auto;display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:22px}.carte{position:relative;min-height:420px;background:#a9d6cf;border:8px solid #8c552e;box-shadow:inset 0 0 40px #29534d66,0 6px 25px #0009}.carte svg{display:block;width:100%;height:100%;min-height:420px}.carte svg path{fill:#d6bb7e;stroke:#684d2d;stroke-width:.7;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .12s}.carte svg path:hover,.carte svg path:focus{fill:#e9a95e;outline:none;stroke:#321f13;stroke-width:2}.panneau{background:#24140ff0;border:2px solid #b68b52;padding:20px;max-height:calc(100vh - 140px);overflow:auto}.panneau h2{color:#f5d28b;margin:0 0 15px}.panneau input{width:100%;padding:11px;background:#fff0d0;border:1px solid #bd965a;color:#21130d;margin-bottom:12px}.pays{display:block;width:100%;text-align:left;background:transparent;color:#f5ddb5;border:0;border-bottom:1px solid #6c4934;padding:8px 4px}.pays:hover,.pays:focus-visible{background:#5d3521}.pays-select{font-weight:bold;color:#f5d28b}.drapeau{display:inline-block;width:32px;height:22px;object-fit:cover;border:1px solid #d9bc80;margin-right:12px;vertical-align:middle;background:#e7d7bd}.pays-recherche{display:block;width:100%;padding:12px!important;margin:0 0 12px!important;border:2px solid #d2a55d!important;border-radius:5px;font:17px Georgia,serif}.aucun-pays{padding:12px;color:#f5d28b}.pays-liste{display:grid;grid-template-columns:1fr;gap:2px}.message{font-size:18px;line-height:1.55}.titre-film{display:block;border-bottom:1px solid #76513a;padding:12px 0;color:#f9dfaa}.titre-film a{color:#ffe2a1}.indication{text-align:center;font-size:15px;color:#f5d9a7;padding:10px}.continents{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.continents button{padding:17px 7px;border:2px solid #cda061;background:#412314;color:#ffe3a5;font-size:18px}.continents button:hover{background:#70401f}@media(max-width:760px){.contenu{grid-template-columns:1fr}.carte,.carte svg{min-height:300px}.panneau{max-height:none}.continents{grid-template-columns:repeat(2,1fr)}.badge{top:47%;left:35%;width:38%}}
</style></head><body>
<main class="agence" aria-label="Agence de voyages CINEMALAND, années 1970"><button class="carte-clic" id="ouvrir" aria-label="Ouvrir le planisphère et choisir un continent">Ouvrir le planisphère</button><div class="badge">CHOISISSEZ VOTRE DESTINATION</div><a class="sortie" href="index.html" aria-label="Sortir par la vraie porte vers la rue du KURSAAL" title="Sortir dans la rue">Sortie</a></main>
<section class="ecran" id="ecran" aria-label="Cartes interactives"><div class="barre"><h1 id="titre">Le monde du cinéma</h1><div class="boutons"><button id="retour" type="button">RETOUR</button><button id="fermer" type="button">FERMER</button></div></div><div class="contenu"><div><div class="carte" id="carte"></div><div class="indication" id="indication">Choisissez un continent.</div></div><aside class="panneau" id="panneau"></aside></div></section>
<script>
'use strict';
let geo=[],destinations={},catalogue=[],continent=null,pays=null;
const $=id=>document.getElementById(id), continents=['Europe','Afrique','Asie','Amériques','Océanie'];
const fetchJSON=async(url,def)=>{try{const r=await fetch(url,{cache:'no-store'});return r.ok?await r.json():def}catch{return def}};
Promise.all([fetchJSON('pays-geographie.json',[]),fetchJSON('destinations.json',{pays:{}})]).then(([g,d])=>{geo=g;destinations=d.pays||{};if($('ecran').classList.contains('ouvert'))afficher();});
// Lecture facultative du catalogue local : aucune modification ni filtrage de la base.
const s=document.createElement('script');s.src='catalogue.js';s.onload=()=>{catalogue=Array.isArray(window.CINEMALAND_CATALOGUE)?window.CINEMALAND_CATALOGUE:[];if($('ecran').classList.contains('ouvert'))afficher();};document.head.append(s);
function ouvrir(){continent=null;pays=null;$('ecran').classList.add('ouvert');document.body.style.overflow='hidden';afficher()}
function fermer(){ $('ecran').classList.remove('ouvert');document.body.style.overflow='';continent=null;pays=null;}
function retour(){if(pays){pays=null;continent=null}else{fermer();return}afficher()}
$('ouvrir').onclick=ouvrir;$('fermer').onclick=fermer;$('retour').onclick=retour;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('ecran').classList.contains('ouvert'))retour()});
function bouton(label,fn,cls='pays'){const b=document.createElement('button');b.type='button';b.className=cls;b.textContent=label;b.onclick=fn;return b}
function drapeau(code){return /^[A-Z]{2}$/.test(code||'')?[...code].map(c=>String.fromCodePoint(127397+c.charCodeAt(0))).join(''):' ';}
function imageDrapeau(code,nom){const img=document.createElement('img');img.className='drapeau';img.alt='Drapeau de '+nom;img.loading='lazy';img.src='https://flagcdn.com/w40/'+code.toLowerCase()+'.png';img.onerror=()=>{const sp=document.createElement('span');sp.className='drapeau';sp.textContent=drapeau(code);img.replaceWith(sp)};return img}
function afficher(){
 const p=$('panneau');p.replaceChildren();$('carte').replaceChildren();
 $('retour').textContent=pays?'RETOUR AUX DESTINATIONS':'RETOUR À L’AGENCE';
 if(!pays){
  $('titre').textContent='Le monde du cinéma';
  $('indication').textContent='Cliquez directement sur un pays de la carte ou choisissez-le dans la liste.';
  const h=document.createElement('h2');h.textContent='Pays et destinations';p.append(h);
  const search=document.createElement('input');search.className='pays-recherche';search.type='search';search.placeholder='Rechercher un pays…';search.setAttribute('aria-label','Rechercher un pays');p.append(search);const list=document.createElement('div');list.className='pays-liste';p.append(list);search.addEventListener('input',()=>{const needle=search.value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();let shown=0;for(const b of list.children){const name=b.dataset.nom||'';const visible=name.includes(needle);b.hidden=!visible;if(visible)shown++}search.setAttribute('aria-description',shown+' pays trouvés')});
  const groupe=[...geo].sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
  for(const c of groupe){const b=bouton('',()=>{window.location.href='destination.html?pays='+encodeURIComponent(c.code)});
   b.dataset.nom=c.nom.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const flag=imageDrapeau(c.code,c.nom);b.append(flag,document.createTextNode(c.nom));list.append(b);}
  carteMonde();return;
 }
 $('titre').textContent=pays.nom;
 $('indication').textContent='Films et séries classés par pays de production.';
 const h=document.createElement('h2');h.append(imageDrapeau(pays.code,pays.nom),document.createTextNode(pays.nom));p.append(h);
   // Pays de production : données du catalogue local, complétées si besoin par destinations.json.
  // Ne jamais déduire le pays de production du décor ou du lieu de l’intrigue.
  const entries=[];const vus=new Set();
  const codes=v=>{if(!v)return [];if(Array.isArray(v))return v.flatMap(codes);if(typeof v==='object')return codes(v.iso_3166_1||v.code||v.iso||v.name||'');return String(v).split(/[,;|]/).map(x=>x.trim().toUpperCase()).filter(Boolean)};
  const ajoute=(item)=>{const key=[item.title,item.year,item.kind].join('|');if(!vus.has(key)){vus.add(key);entries.push(item)}};
  for(const film of catalogue){
    const production=codes(film.production_countries||film.productionCountries||film.production_country||film.productionCountry||film.countries||film.country||film.origin_country||film.originCountry);
    if(production.includes(pays.code.toUpperCase()))ajoute(film);
  }
  for(const e of destinations[pays.code]||[]){
    const title=typeof e==='string'?e:e.title;const year=typeof e==='string'?'':e.year;
    const found=catalogue.find(x=>x.title===title&&(!year||String(x.year)===String(year)));
    if(found)ajoute(found);
  }
  if(!entries.length){const t=document.createElement('p');t.className='message';t.textContent='Aucun film ou série associé à ce pays de production pour le moment.';p.append(t)}
  else{entries.sort((a,b)=>a.title.localeCompare(b.title,'fr'));for(const found of entries){const row=document.createElement('div');row.className='titre-film';const a=document.createElement('a');a.href=(found.kind==='Série'?'series.html':'films.html')+'?fiche='+encodeURIComponent(found.title)+'&annee='+encodeURIComponent(found.year||'');a.textContent=found.title+(found.year?' ('+found.year+')':'');row.append(a);p.append(row)}}
p.append(bouton('AUTRE PAYS',()=>{pays=null;continent=null;afficher()}));
 carteMonde();
}
function proj(lon,lat,bounds){const [minX,maxX,minY,maxY]=bounds;const w=maxX-minX,h=maxY-minY;return [(lon-minX)/w*1000,(maxY-lat)/h*560]}
function formes(items,bounds,click){const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 1000 560');svg.setAttribute('role','img');svg.setAttribute('aria-label','Carte géographique interactive');for(const c of items){for(const ring of c.formes||[]){if(ring.length<4)continue;let path='';for(let i=0;i<ring.length;i++){const [x,y]=proj(ring[i][0],ring[i][1],bounds);path+=(i?'L':'M')+x.toFixed(1)+','+y.toFixed(1)}const el=document.createElementNS(ns,'path');el.setAttribute('d',path+'Z');el.setAttribute('tabindex','0');el.setAttribute('aria-label',c.nom);const t=document.createElementNS(ns,'title');t.textContent=c.nom;el.append(t);el.addEventListener('click',()=>click(c));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();click(c)}});svg.append(el)}}$('carte').append(svg)}
function carteMonde(){formes(geo,[-180,180,-62,84],c=>{window.location.href='destination.html?pays='+encodeURIComponent(c.code)})}
</script></body></html>
