name: Ajouter ou supprimer un film ou une série

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: videotheque-ajout
  cancel-in-progress: false

jobs:
  catalogue:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '[VIDEOTHEQUE] Ajouter :') ||
       startsWith(github.event.issue.title, '[VIDEOTHEQUE] Supprimer :'))
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Modifier les catalogues
        id: modification
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const body = process.env.ISSUE_BODY || '';
          const block = body.match(/```json\s*(\{[\s\S]*?\})\s*```/i);
          const data = JSON.parse(block ? block[1] : body.trim());
          const deleting = process.env.ISSUE_TITLE.startsWith('[VIDEOTHEQUE] Supprimer :');
          const action = deleting ? 'delete' : 'add';
          if (data.action && data.action !== action) throw new Error('Action incohérente avec le titre.');
          const title = String(data.title || '').trim();
          const normalize = value => String(value ?? '')
            .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[’‘`´]/g, "'")
            .replace(/[^\p{L}\p{N}]+/gu, ' ')
            .trim().replace(/\s+/g, ' ').toLocaleLowerCase('fr');
          const kindValue = normalize(data.kind);
          const year = Number(data.year);
          if (!title || title.length > 200 || !['film', 'serie'].includes(kindValue) ||
              !Number.isInteger(year) || year < 1888 || year > 2100)
            throw new Error('Titre, type ou année invalide.');
          const kind = kindValue === 'film' ? 'Film' : 'Série';
          const path = 'catalogue.js';
          const source = fs.readFileSync(path, 'utf8');
          const marker = /window\.CINEMALAND_CATALOGUE\s*=\s*\[/g;
          const match = marker.exec(source);
          if (!match) throw new Error('Catalogue introuvable dans catalogue.js.');
          const start = marker.lastIndex - 1;
          let depth = 0, quote = null, escaped = false, end = -1;
          for (let i = start; i < source.length; i++) {
            const c = source[i];
            if (quote) {
              if (escaped) escaped = false;
              else if (c === '\\') escaped = true;
              else if (c === quote) quote = null;
              continue;
            }
            if (c === '"' || c === "'" || c === '`') quote = c;
            else if (c === '[') depth++;
            else if (c === ']' && --depth === 0) { end = i + 1; break; }
          }
          if (end < 0) throw new Error('Fin du catalogue introuvable.');
          const catalogue = vm.runInNewContext('(' + source.slice(start, end) + ')', Object.create(null), {timeout: 1000});
          if (!Array.isArray(catalogue)) throw new Error('Catalogue invalide.');
          const files = [{path, source, start, end, catalogue}];
          const sameTitle = item => normalize(item.title) === normalize(title);
          const sameEntry = item => sameTitle(item) && normalize(item.kind) === kindValue &&
            Number(item.year) === year;
          const occurrences = files.flatMap(f => f.catalogue.filter(sameEntry));
          console.log('Demande :', JSON.stringify({title, kind, year, action}));
          for (const f of files) {
            const close = f.catalogue.filter(x => sameTitle(x));
            console.log(`${f.path} : ${f.catalogue.length} fiches ; titre correspondant :`,
              JSON.stringify(close.map(x => ({title:x.title, kind:x.kind, year:x.year}))));
          }
          if (deleting && !occurrences.length) {
            const close = files.flatMap(f => f.catalogue.filter(x =>
              normalize(x.title).includes(normalize(title)) || normalize(title).includes(normalize(x.title))));
            throw new Error(`Titre absent du catalogue : ${title} (${year}). ` +
              `Fiches proches : ${JSON.stringify(close.map(x => ({title:x.title, kind:x.kind, year:x.year})))}`);
          }
          if (!deleting && files.some(f => f.catalogue.some(sameTitle)))
            throw new Error(`Titre déjà présent dans au moins un catalogue : ${title}.`);
          const slug = normalize(title).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
          const entry = {title, kind, year, period: String(year), genre: 'À compléter',
            description: 'Description à compléter.', poster: 'affiches/' + slug + '.jpg',
            wiki: 'https://fr.wikipedia.org/wiki/Sp%C3%A9cial:Recherche?search=' + encodeURIComponent(title)};
          let changed = false;
          for (const f of files) {
            const updated = deleting ? f.catalogue.filter(item => !sameEntry(item)) : [...f.catalogue, entry];
            if (updated.length !== f.catalogue.length) {
              fs.writeFileSync(f.path, f.source.slice(0, f.start) +
                JSON.stringify(updated, null, 2) + f.source.slice(f.end), 'utf8');
              changed = true;
            }
          }
          const message = `${deleting ? 'Suppression' : 'Ajout'} effectué : ${title} (${year}).`;
          fs.writeFileSync('resultat-demande.txt', message, 'utf8');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\naction=${action}\n`);
          JS

      - name: Installer Python
        if: steps.modification.outputs.changed == 'true' && steps.modification.outputs.action == 'add'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Récupérer les affiches TMDB
        if: steps.modification.outputs.changed == 'true' && steps.modification.outputs.action == 'add'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/affiches.py

      - name: Compléter réalisateurs et acteurs TMDB
        if: steps.modification.outputs.changed == 'true' && steps.modification.outputs.action == 'add'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/credits_tmdb.py

      - name: Enregistrer la modification
        if: steps.modification.outputs.changed == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue.js
          if [ -d affiches ]; then git add affiches/; fi
          if ! git diff --cached --quiet; then
            git commit -m "Modifier les catalogues (issue #${ISSUE_NUMBER})"
            git push
          fi

      - name: Confirmer la demande
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file resultat-demande.txt
          gh issue close "$ISSUE_NUMBER"
