name: Affiches automatiques TMDB
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/affiches.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  affiches:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le catalogue
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Récupérer les affiches TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/affiches.py
      - name: Enregistrer les affiches et les liens
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html affiches/
          git diff --cached --quiet || (git commit -m 'Synchronisation automatique des affiches TMDB' && git push)
