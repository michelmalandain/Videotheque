<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CINEMALAND — Gérer notre avis</title><style>
:root{--gold:#e8b85b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#53151c,#14090c 55%,#07080b);color:#f6e8cf;font:18px Georgia,serif;min-height:100vh}.curtain{height:30px;background:repeating-linear-gradient(90deg,#490810 0,#a5202d 22px,#590b15 42px);border-bottom:4px solid #c69a51}header{text-align:center;padding:30px 12px;border-bottom:3px double #c69a51}h1{color:#f5cc7b;letter-spacing:2px;margin:0}main{max-width:720px;margin:30px auto;padding:24px;background:#1c1016;border:1px solid #b88b46;border-radius:12px}h2{color:#f5cc7b}label{display:block;margin:18px 0 7px}input[type=password],textarea{display:block;width:100%;padding:12px;border-radius:5px;border:1px solid #c49b59;background:#fff8ec;color:#211219;font:17px Arial,sans-serif}textarea{min-height:130px;resize:vertical}button{background:#865019;border:1px solid #f5cc7b;color:white;border-radius:5px;padding:11px 20px;font-size:17px;cursor:pointer}button:disabled{opacity:.6}a{color:#f5cc7b}#poster{max-width:120px;max-height:180px;object-fit:contain;float:right;margin:0 0 12px 16px}.stars{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stars label{margin:0;cursor:pointer}.stars input{accent-color:#b98529}#message{min-height:28px;margin-top:16px}small{color:#dbc9aa}</style></head><body><div class="curtain"></div><header><h1>CINEMALAND</h1><p>Michel &amp; Christiane · Gérer notre avis</p></header><main><img id="poster" alt="" hidden><h2 id="title">Chargement…</h2><p id="meta"></p><form id="form"><label for="password">🔑 Mot de passe</label><input type="password" id="password" autocomplete="current-password" required><label><input type="checkbox" id="watch"> 🍿 À voir</label><label>⭐ Notre note commune</label><div class="stars" id="stars"><label><input type="radio" name="stars" value="0" checked> Aucune</label><label><input type="radio" name="stars" value="1"> ★</label><label><input type="radio" name="stars" value="2"> ★★</label><label><input type="radio" name="stars" value="3"> ★★★</label><label><input type="radio" name="stars" value="4"> ★★★★</label><label><input type="radio" name="stars" value="5"> ★★★★★</label></div><label for="comment">💬 Notre commentaire</label><textarea id="comment" maxlength="1500" placeholder="Notre avis sur ce film ou cette série…"></textarea><small>1500 caractères maximum. Un seul avis commun pour Michel et Christiane.</small><p><button type="submit" id="save">💾 Enregistrer</button></p><p id="message" role="status" aria-live="polite"></p></form><p><a id="back" href="films.html">← Retour aux films</a></p></main><script src="catalogue.js"></script><script>
(function(){
 const api='https://videotheque-admin.michelmalandain.workers.dev/reviews';
 const params=new URLSearchParams(location.search),title=params.get('title'),kind=params.get('kind'),year=Number(params.get('year'));
 const msg=document.getElementById('message');
 const catalogue=window.CINEMALAND_CATALOGUE||[];
 const item=catalogue.find(x=>x.title===title&&x.kind===kind&&Number(x.year)===year);
 const back=document.getElementById('back');back.href=kind==='Série'?'series.html':'films.html';back.textContent=kind==='Série'?'← Retour aux séries':'← Retour aux films';
 if(!title||!kind||!Number.isFinite(year)||!year){document.getElementById('title').textContent='Lien incomplet';document.getElementById('form').hidden=true;return;}
 document.getElementById('title').textContent=item?.title||title;document.getElementById('meta').textContent=item?(item.period+' · '+item.genre):(kind+' · '+year);
 if(item?.poster){const img=document.getElementById('poster');img.src=item.poster;img.alt='Affiche de '+item.title;img.hidden=false;}
 const key=kind+'|'+year+'|'+title.normalize('NFC').toLocaleLowerCase('fr');
 async function load(){try{const response=await fetch(api+'?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error();const data=await response.json();const r=(data.reviews||{})[key];if(r){document.getElementById('watch').checked=!!r.watch;document.querySelector('input[name="stars"][value="'+(r.stars||0)+'"]').checked=true;document.getElementById('comment').value=r.comment||'';}}catch{msg.textContent='Impossible de charger les avis actuels. Vérifiez la connexion avant de modifier.';}}
 load();
 document.getElementById('form').addEventListener('submit',async e=>{
 e.preventDefault();const password=document.getElementById('password').value;if(!password)return;
 const save=document.getElementById('save');save.disabled=true;msg.textContent='Enregistrement en cours…';
 try{const response=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+password},body:JSON.stringify({title,kind,year,watch:document.getElementById('watch').checked,stars:Number(document.querySelector('input[name="stars"]:checked').value),comment:document.getElementById('comment').value})});const result=await response.json();if(!response.ok)throw Error(result.message||'Erreur '+response.status);msg.textContent='🟢 Avis enregistré !';document.getElementById('password').value='';}catch(error){msg.textContent='🔴 '+error.message;}finally{save.disabled=false;}
 });
})();
</script></body></html>
