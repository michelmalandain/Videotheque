(function(){
 const initial=JSON.stringify(window.CINEMALAND_CATALOGUE || []);
 let checking=false;
 async function checkCatalogue(){
  if(checking || document.hidden) return;
  checking=true;
  try{
   const r=await fetch('catalogue.js?actualisation='+Date.now(),{cache:'no-store'});
   if(!r.ok)return;
   const source=await r.text();
   const m=source.match(/window\.CINEMALAND_CATALOGUE\s*=\s*(\[[\s\S]*\])\s*;/);
   if(!m)return;
   const current=JSON.stringify(JSON.parse(m[1]));
   if(current!==initial) location.reload();
  }catch(e){/* réseau momentanément indisponible */}
  finally{checking=false;}
 }
 setInterval(checkCatalogue,20000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkCatalogue();});
})();

      const ouvrirCatalogue=()=>{window.location.href=(type==='tv'?'series.html':'films.html')+'?fiche='+encodeURIComponent(present.title)+'&annee='+encodeURIComponent(annee)};
      poster.addEventListener('click',ouvrirCatalogue);
      poster.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();ouvrirCatalogue()}});
    }

    info.append(meta,label,overview,source,proposer,ajouter);grid.append(poster,info);d.append(close,h,grid);
    document.body.append(d);d.addEventListener('close',()=>d.remove());d.addEventListener('click',e=>{if(e.target===d)d.close()});d.showModal();
    // Complète la fiche si le Worker propose déjà une route de détails.
    if(id)fetch('https://videotheque-admin.michelmalandain.workers.dev/details?type='+type+'&id='+encodeURIComponent(id))
      .then(r=>{if(!r.ok)throw Error('non disponible');return r.json()})
      .then(data=>{const detail=data.details||data;const synopsis=detail.overview||detail.summary||detail.description;if(synopsis)overview.textContent=synopsis;
        const genres=Array.isArray(detail.genres)?detail.genres.map(g=>g.name||g).join(', '):'';
        if(genres){const p=document.createElement('p');p.textContent='Genres : '+genres;info.insertBefore(p,label)}
      }).catch(()=>{});
  }
  liste.addEventListener('click', function (evenement) {
    const ligne=evenement.target.closest('.person-film');
    if(!ligne||!liste.contains(ligne))return;
    evenement.preventDefault();evenement.stopPropagation();
    // Toute la ligne (affiche et titre) ouvre la fiche TMDB de l'œuvre exacte.
    ficheTMDB(ligne,ligne.querySelector('img'));
  },true);
  liste.addEventListener('keydown',function(e){
    if(e.key!=='Enter'&&e.key!==' ')return;
    const ligne=e.target.closest('.person-film');
    if(!ligne||!liste.contains(ligne))return;
    e.preventDefault();ficheTMDB(ligne,ligne.querySelector('img'));
  });
  const style=document.createElement('style');
  style.textContent='#person-films .person-film{cursor:pointer!important}#person-films .person-film:hover{background:#42202a}#person-films .person-film img{cursor:pointer;transition:transform .2s}#person-films .person-film:hover img{transform:scale(1.06)}#person-films .person-film strong{text-decoration:underline;text-underline-offset:3px}';
  document.head.append(style);
})();
// Ouvre la fiche d'une œuvre présente dans notre catalogue après navigation.
(function(){
 const params=new URLSearchParams(location.search),titre=params.get('fiche'),annee=params.get('annee');
 if(!titre)return;
 const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
 const x=catalogue.find(f=>norm(f.title)===norm(titre)&&(!annee||String(f.year)===annee));
 if(!x)return;

<script id="cinemaland-avis">
(function(){
const API='https://videotheque-admin.michelmalandain.workers.dev/reviews';
const norm=x=>String(x||'').normalize('NFC').toLocaleLowerCase('fr');
const key=x=>x.kind+'|'+x.year+'|'+norm(x.title);
function draw(reviews){
 if(!Array.isArray(window.CINEMALAND_CATALOGUE))return;
 const entries=window.CINEMALAND_CATALOGUE;
 if(document.getElementById('cards')){
  document.querySelectorAll('#cards .card').forEach(card=>{
   const title=card.querySelector('.card-title')?.textContent?.trim();
   const x=entries.find(f=>f.title===title&&f.kind===(location.pathname.includes('series')?'Série':'Film'));
   if(!x)return;
   card.querySelector('.cinemaland-avis-box')?.remove();
   const r=reviews[key(x)];if(!r)return;
   const box=document.createElement('div');box.className='cinemaland-avis-box';box.style.cssText='grid-column:1/-1;padding:12px 16px;border-top:1px solid #c79b4a;color:#f6e8cf;white-space:pre-wrap';
   const parts=[];if(r.watch)parts.push('🍿 À VOIR');if(r.stars)parts.push('⭐ Notre note : '+'★'.repeat(r.stars)+'☆'.repeat(5-r.stars));
   box.textContent=parts.join('  ·  ')+(r.comment?'\n📝 Notre avis : '+r.comment:'');if(box.textContent.trim())card.append(box);
  });
 }
 const count=document.getElementById('watch-count');if(count)count.textContent=Object.values(reviews).filter(x=>x.watch).length;
}
let last='';async function refresh(){try{const r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const d=await r.json();const json=JSON.stringify(d.reviews||{});if(json!==last){last=json;draw(d.reviews||{});}}catch{}}
refresh();setInterval(refresh,30000);
const cards=document.getElementById('cards');if(cards){new MutationObserver(()=>{if(last){try{draw(JSON.parse(last))}catch{}}}).observe(cards,{childList:true});}
})();
</script>

<script id="cinemaland-fiche-avis">
(function(){
 const api='https://videotheque-admin.michelmalandain.workers.dev/reviews';
 const key=x=>x.kind+'|'+x.year+'|'+String(x.title||'').normalize('NFC').toLocaleLowerCase('fr');
 let request=0;
 window.cinemalandAfficherAvisFiche=async function(x){
  const dlg=document.getElementById('film-dialog');
  let box=dlg.querySelector('#fiche-avis-commun');
  if(!box){box=document.createElement('section');box.id='fiche-avis-commun';box.style.cssText='border-top:1px solid #c79b4a;margin-top:20px;padding-top:14px;white-space:pre-wrap;line-height:1.8';dlg.append(box);}
  const id=++request;
  box.textContent='🍿 À voir · ⭐ Notre note · 💬 Notre avis\nChargement…';
  try{
   const response=await fetch(api+'?t='+Date.now(),{cache:'no-store'});
   if(!response.ok)throw Error('Erreur');
   const data=await response.json();
   if(id!==request||!dlg.open)return;
   const r=(data.reviews||{})[key(x)]||{},stars=Math.max(0,Math.min(5,Number(r.stars)||0));
   box.textContent='🍿 À voir : '+(r.watch?'Oui':'Non')+'\n⭐ Notre note : '+(stars?'★'.repeat(stars)+'☆'.repeat(5-stars):'Pas encore noté')+'\n💬 Notre avis : '+(r.comment||'Aucun commentaire pour le moment.');
  }catch{if(id===request)box.textContent='Les avis sont momentanément indisponibles.';}
 };
})();
</script>

<script id="cinemaland-trailers-js">
(function(){
 const fiche=document.getElementById('film-dialog');
 const btn=document.createElement('button');btn.id='trailer-button';btn.type='button';btn.textContent='▶ Voir la bande-annonce';
 document.getElementById('film-source').before(btn);
 const dialog=document.createElement('dialog');dialog.id='trailer-dialog';
 const close=document.createElement('button');close.id='trailer-close';close.type='button';close.textContent='Fermer la vidéo';
 const frame=document.createElement('iframe');frame.id='trailer-frame';frame.title='Bande-annonce';frame.allow='accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share';frame.allowFullscreen=true;
 dialog.append(close,frame);document.body.append(dialog);
 function stop(){frame.removeAttribute('src')}
 close.addEventListener('click',()=>dialog.close());dialog.addEventListener('close',stop);
 dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
 let token=0,key=null;
 const original=window.openFilm;
 window.openFilm=function(x){
  original(x);const current=++token;key=null;btn.style.display='none';
  const year=String(x.year||'');const type=x.kind==='Série'?'tv':'movie';
  if(!/^\d{4}$/.test(year))return;
  const params=new URLSearchParams({title:x.title,year,type});
  fetch('https://videotheque-admin.michelmalandain.workers.dev/trailer?'+params)
   .then(r=>{if(!r.ok)throw Error('Service indisponible');return r.json()})
   .then(data=>{if(current!==token||!fiche.open||fiche.dataset.currentTitle!==x.title)return;
    if(/^[a-zA-Z0-9_-]{11}$/.test(data.key||'')){key=data.key;btn.style.display='inline-block'}
   }).catch(()=>{});
 };
 btn.addEventListener('click',()=>{if(!key)return;frame.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(key)+'?autoplay=1&rel=0';dialog.showModal()});
 fiche.addEventListener('close',()=>{++token;btn.style.display='none';if(dialog.open)dialog.close()});
})();
