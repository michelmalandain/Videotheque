<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Vidéothèque de Michel et Christiane</title><style>
:root{--gold:#e8b85b;--red:#7e101a;--dark:#090c10}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#53151c,#14090c 52%,#07080b);color:#f6e8cf;font:17px Georgia,serif}header{text-align:center;padding:48px 15px 36px;border-bottom:3px double var(--gold);background:linear-gradient(90deg,#240509aa,#6d1220aa,#240509aa)}h1{font-size:clamp(30px,5vw,60px);color:#f5cc7b;text-shadow:2px 3px #210707;margin:0;letter-spacing:2px}header p{font-style:italic;font-size:25px;margin:12px}nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:14px;background:#080c12;border-bottom:1px solid var(--gold)}button,select,input{font:inherit}nav button,.toolbar select{background:#14171b;color:#f4dcae;border:1px solid #a77730;padding:11px 22px;cursor:pointer}nav button.active,nav button:hover{background:#7e101a}.wrap{max-width:1250px;margin:30px auto;padding:0 20px}.toolbar{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:24px}input{flex:1;min-width:200px;padding:14px;background:#f7e4c2;border:2px solid var(--gold);border-radius:6px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:25px}.card{background:linear-gradient(#141a1e,#070a0d);border:3px double #c89442;border-radius:9px;overflow:hidden;box-shadow:0 10px 30px #0009}.poster{height:290px;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;background:linear-gradient(145deg,#303e4a,#0b151c 65%,#4d2521);font-size:38px;letter-spacing:3px;font-weight:bold;color:#f6dba6;text-shadow:2px 3px 6px #000}.card:nth-child(2) .poster{background:linear-gradient(145deg,#765039,#2c1a15 65%,#120d0a)}.card:nth-child(3) .poster{background:linear-gradient(145deg,#6a3a19,#17110d 65%,#292b2a)}.info{padding:18px}.info h2{color:var(--gold);margin:0 0 10px;font-size:24px}.meta{color:#d5c4a4;font-size:15px}.info p{line-height:1.5}.info a{color:#f4cf85;text-decoration:underline}footer{text-align:center;padding:40px;color:#d8b982;font-style:italic}#empty{display:none;text-align:center;padding:40px}@media(max-width:600px){.poster{height:210px}header{padding:30px 12px}}
header{position:relative;border-bottom:7px ridge #b9893e;box-shadow:0 12px 30px #000a}header:before,header:after{content:'❧';position:absolute;top:30px;color:#c99b52;font-size:48px}header:before{left:5%}header:after{right:5%;transform:scaleX(-1)}.card{position:relative}.card:before{content:'✦';position:absolute;top:9px;left:13px;color:#f2ce82;z-index:1}.poster{height:330px;position:relative;flex-direction:column;gap:18px;border-bottom:2px solid #c89442}.poster:before{content:none}.poster:after{content:'';display:none;font:12px Georgia,serif;letter-spacing:2px;color:#ead5b0;border:1px solid #b18c53;padding:9px 12px;background:#0b0a0a99}.poster span{font-size:clamp(25px,3vw,36px)}.curtain{height:34px;background:repeating-linear-gradient(90deg,#490810 0px,#a5202d 22px,#590b15 42px);border-bottom:5px solid #c69a51;box-shadow:0 6px 12px #0009}.info a{display:inline-block;margin-top:8px}footer{border-top:1px solid #ab7d38} @media(max-width:600px){header:before,header:after{display:none}}
</style><style>
.card{cursor:pointer}.card:focus-visible{outline:3px solid #f5cc7b}.film-dialog{border:2px solid #d6a452;border-radius:12px;background:linear-gradient(#37131b,#100d12);color:#f8e7ce;max-width:680px;width:calc(100% - 30px);max-height:90vh;overflow:auto;padding:28px;box-shadow:0 20px 70px #000}.film-dialog::backdrop{background:#000c}.film-dialog h2{color:#f5cc7b;font-size:30px}.film-dialog h3{color:#e8b85b}.film-dialog p{line-height:1.6}.film-dialog .close{float:right;background:#7e101a;color:white;border:1px solid #e8b85b;border-radius:5px;padding:8px 14px;cursor:pointer}.film-dialog .cast{padding-left:20px}.film-dialog .credit{color:#ead1a0}
</style></head><body><div class="curtain" aria-hidden="true"></div><header><h1>LA VIDÉOTHÈQUE<br>DE MICHEL ET CHRISTIANE</h1><p>Nos films et séries préférés</p></header><nav><button data-kind="Tous" class="active">ACCUEIL</button><button data-kind="Série">SÉRIES</button><button data-kind="Film">FILMS</button></nav><main class="wrap"><div class="toolbar"><input id="search" aria-label="Rechercher" placeholder="Rechercher un film ou une série…"><select id="genre" aria-label="Genre"><option value="">Tous les genres</option><option>Historique</option><option>Policier</option><option>Action</option><option>Drame</option></select><select id="sort" aria-label="Tri"><option value="title">Titre A → Z</option><option value="year">Année</option></select></div><div class="cards" id="cards"></div><p id="empty">Aucun titre trouvé.</p></main><footer>♥ Michel et Christiane · Le cinéma est un rêve qui ne finit jamais…</footer><dialog class="film-dialog" id="film-dialog" aria-labelledby="film-title"><button class="close" id="close-film" type="button">✕ Fermer</button><h2 id="film-title"></h2><p id="film-meta"></p><p id="film-summary"></p><h3 id="director-label">🎬 Réalisation</h3><p id="film-director" class="credit"></p><h3>⭐ Acteurs principaux</h3><ol id="film-cast" class="cast"></ol><p id="film-source"></p></dialog><script>
// Pour ajouter un titre, dupliquer une ligne dans ce catalogue.
const catalogue=[
  {"title":"Peaky Blinders","kind":"Série","year":2013,"period":"2013–2022 · 6 saisons","genre":"Drame, Crime","description":"L’ascension de la famille Shelby dans le Birmingham de l’après-Première Guerre mondiale.","poster":"affiches/peaky-blinders.jpg","wiki":"https://fr.wikipedia.org/wiki/Peaky_Blinders_(s%C3%A9rie_t%C3%A9l%C3%A9vis%C3%A9e)",summary:"En 1919, à Birmingham, soldats, révolutionnaires politiques et criminels combattent pour se faire une place dans le paysage industriel de l'après-Guerre. Le Parlement s'attend à une violente révolte, et Winston Churchill mobilise des forces spéciales pour contenir les menaces. La famille Shelby compte parmi les membres les plus redoutables. Surnommés les \"Peaky Blinders\" par rapport à leur utilisation de lames de rasoir cachées dans leurs casquettes, ils tirent principalement leur argent de paris et de vol. Tommy Shelby, le plus dangereux de tous, va devoir faire face à l'arrivée de Campbell, un impitoyable chef de la police qui a pour mission de nettoyer la ville. Ne doit-il pas se méfier tout autant de la ravissante Grace Burgess ? Fraîchement installée dans le voisinage, celle-ci semble cacher un mystérieux passé et un dangereux secret.","directors":["Steven Knight"],"cast":[{"name": "Cillian Murphy", "character": "Thomas Shelby"}, {"name": "Paul Anderson", "character": "Arthur Shelby"}, {"name": "Sophie Rundle", "character": "Ada Shelby"}, {"name": "Natasha O'Keeffe", "character": "Lizzie Stark"}]},
  {"title":"Spartacus","kind":"Série","year":2010,"period":"2010–2013","genre":"Drame","description":"Un gladiateur devient le symbole d’une révolte contre Rome.","poster":"affiches/spartacus.jpg","wiki":"https://fr.wikipedia.org/wiki/Spartacus_(s%C3%A9rie_t%C3%A9l%C3%A9vis%C3%A9e)",summary:"C’est dans le sang et le sable des arènes que s’écrit la légende de Spartacus. Puissant guerrier Thrace trahi par un ambitieux légat romain, Spartacus est réduit en esclavage, contraint de devenir gladiateur s’il veut un jour revoir sa femme. Au sein de l’école de gladiateurs du machiavélique Batiatus et de son épouse Lucretia, Spartacus recevra l’enseignement de l’impitoyable Doctore pour devenir le plus redoutable des combattants. Mais entre l’hostilité des autres gladiateurs et les manigances de Lucretia, Spartacus devra tout sacrifier pour pouvoir survivre...","directors":["Steven S. DeKnight"],"cast":[{"name": "Liam McIntyre", "character": "Spartacus"}, {"name": "Manu Bennett", "character": "Crixus"}, {"name": "Dustin Clare", "character": "Gannicus"}, {"name": "Cynthia Addai-Robinson", "character": "Naevia"}, {"name": "Jaime Murray", "character": "Gaia"}]},
  {"title":"Rome","kind":"Série","year":2005,"period":"2005–2007 · 2 saisons","genre":"Action & Adventure, Drame","description":"Une fresque sur la fin de la République romaine et l’ascension de l’Empire.","poster":"affiches/rome.jpg","wiki":"https://fr.wikipedia.org/wiki/Rome_(s%C3%A9rie_t%C3%A9l%C3%A9vis%C3%A9e)",summary:"Les destins de deux soldats romains et de leurs familles alors que la République Romaine est en train de s'effondrer en laissant peu à peu la place à un Empire.","directors":["John Milius", "Bruno Heller", "William J. MacDonald"],"cast":[{"name": "Kevin McKidd", "character": "Lucius Vorenus"}, {"name": "Ray Stevenson", "character": "Titus Pullo"}, {"name": "Ciarán Hinds", "character": "Julius Caesar"}, {"name": "James Purefoy", "character": "Mark Antony"}, {"name": "Polly Walker", "character": "Atia of the Julii"}]},
  {"title":"Gladiator","kind":"Film","year":2000,"period":"2000 · 2 h 35","genre":"Action, Drame, Aventure","description":"Un général romain déchu devient gladiateur et cherche à venger sa famille.","poster":"affiches/gladiator.jpg","wiki":"https://fr.wikipedia.org/wiki/Gladiator_(film,_2000)",summary:"Le général romain Maximus est le plus fidèle soutien de l'empereur Marc Aurèle, qu'il a conduit de victoire en victoire avec une bravoure et un dévouement exemplaires. Jaloux du prestige de Maximus, et plus encore de l'amour que lui voue l'empereur, le fils de Marc Aurèle, Commode, s'arroge brutalement le pouvoir, puis ordonne l'arrestation du général et son exécution. Maximus échappe à ses assassins mais ne peut empêcher le massacre de sa famille. Capturé par un marchand d'esclaves, il devient gladiateur et prépare sa vengeance.","directors":["Ridley Scott"],"cast":[{"name": "Russell Crowe", "character": "Maximus"}, {"name": "Joaquin Phoenix", "character": "Commodus"}, {"name": "Connie Nielsen", "character": "Lucilla"}, {"name": "Oliver Reed", "character": "Proximo"}, {"name": "Richard Harris", "character": "Marcus Aurelius"}]},
  {"title":"avatar","kind":"Film","year":2009,"period":"2009","genre":"Science-Fiction, Action, Aventure","description":"Description à compléter.","poster":"affiches/avatar.jpg","wiki":"https://fr.wikipedia.org/wiki/Sp%C3%A9cial:Recherche?search=avatar",summary:"Un marine paraplégique, envoyé sur la lune Pandora pour une mission unique, est tiraillé entre suivre ses ordres et protéger le monde qu'il considère dorénavant comme le sien.","directors":["James Cameron"],"cast":[{"name": "Sam Worthington", "character": "Jake Sully"}, {"name": "Zoe Saldaña", "character": "Neytiri"}, {"name": "Sigourney Weaver", "character": "Dr. Grace Augustine"}, {"name": "Stephen Lang", "character": "Colonel Miles Quaritch"}, {"name": "Michelle Rodriguez", "character": "Trudy Chacon"}]},
  {"title":"titanic","kind":"Film","year":1997,"period":"1997","genre":"Drame, Romance","description":"Description à compléter.","poster":"affiches/titanic.jpg","wiki":"https://fr.wikipedia.org/wiki/Sp%C3%A9cial:Recherche?search=titanic",summary:"Southampton, 10 avril 1912. Le paquebot le plus grand et le plus moderne du monde, réputé pour son insubmersibilité, le « Titanic », appareille pour son premier voyage. Quatre jours plus tard, il heurte un iceberg. À son bord, un artiste pauvre et une grande bourgeoise tombent amoureux.","directors":["James Cameron"],"cast":[{"name": "Leonardo DiCaprio", "character": "Jack Dawson"}, {"name": "Kate Winslet", "character": "Rose DeWitt Bukater"}, {"name": "Billy Zane", "character": "Cal Hockley"}, {"name": "Kathy Bates", "character": "Molly Brown"}, {"name": "Frances Fisher", "character": "Ruth DeWitt Bukater"}]},
  {"title":"permis de detruire","kind":"Film","year":2026,"period":"2026","genre":"Comédie","description":"Description à compléter.","poster":"affiches/permis-de-detruire.jpg","wiki":"https://fr.wikipedia.org/wiki/Sp%C3%A9cial:Recherche?search=permis%20de%20detruire",summary:"Dominique lutte pour concrétiser son rêve corse entre son cabinet médical en chantier et son combat contre une centrale électrique controversée. Quand Olivier, son ami psychanalyste en plein divorce, débarque pour refaire sa vie sur l’île, les deux pinzuti (Français du continent) aidés de leur ami corse Santu, vont tout faire pour s’intégrer à la culture insulaire pour le meilleur et le pire.","directors":["Éric Fraticelli"],"cast":[{"name": "Kad Merad", "character": "Dominique"}, {"name": "Patrick Timsit", "character": "Olivier"}, {"name": "Éric Fraticelli", "character": "Santu"}, {"name": "Claude Perron", "character": ""}, {"name": "Philippe Corti", "character": ""}]}
];function openFilm(x){const d=document.getElementById('film-dialog');document.getElementById('film-title').textContent=x.title;document.getElementById('film-meta').textContent=x.period+' · '+x.genre;document.getElementById('film-summary').textContent=x.summary||x.description||'';document.getElementById('director-label').textContent=x.kind==='Série'?'🎬 Création':'🎬 Réalisation';document.getElementById('film-director').textContent=(x.directors||[]).join(', ')||'Informations à compléter depuis TMDB';const cast=document.getElementById('film-cast');cast.replaceChildren();for(const a of (x.cast||[]).slice(0,5)){const li=document.createElement('li');li.textContent=typeof a==='string'?a:a.name+(a.character?' — '+a.character:'');cast.append(li)}if(!cast.children.length){const li=document.createElement('li');li.textContent='Informations à compléter depuis TMDB';cast.append(li)}document.getElementById('film-source').textContent=x.directors||x.cast?'Crédits : TMDB':'Crédits TMDB en attente de synchronisation';d.showModal()}document.getElementById('close-film').addEventListener('click',()=>document.getElementById('film-dialog').close());
let kind='Tous';const cards=document.getElementById('cards');function render(){const q=document.getElementById('search').value.toLocaleLowerCase('fr');const g=document.getElementById('genre').value;const s=document.getElementById('sort').value;const list=catalogue.filter(x=>(kind==='Tous'||x.kind===kind)&&(!g||x.genre.includes(g))&&(x.title+' '+x.genre+' '+x.description).toLocaleLowerCase('fr').includes(q)).sort((a,b)=>s==='year'?a.year-b.year:a.title.localeCompare(b.title,'fr'));cards.replaceChildren();for(const x of list){const article=document.createElement('article');article.className='card';const poster=document.createElement('div');poster.className='poster';const posterTitle=document.createElement('span');posterTitle.textContent=x.title.toUpperCase();const img=document.createElement('img');img.src=x.poster;img.alt='Affiche de '+x.title;img.loading='lazy';img.style.cssText='width:100%;height:100%;object-fit:contain;position:absolute;inset:0';img.onerror=()=>{img.remove();poster.append(posterTitle)};poster.append(img);const info=document.createElement('div');info.className='info';const h=document.createElement('h2');h.textContent=x.title;const meta=document.createElement('div');meta.className='meta';meta.textContent=x.period+' · '+x.genre;const p=document.createElement('p');p.textContent=x.summary || x.description;const a=document.createElement('a');a.href=x.wiki;a.target='_blank';a.rel='noopener noreferrer';a.textContent='🌐 Voir sur Wikipédia ↗';info.append(h,meta,p,a);article.append(poster,info);article.tabIndex=0;article.setAttribute('role','button');article.setAttribute('aria-label','Voir la fiche de '+x.title);article.addEventListener('click',e=>{if(e.target.closest('a'))return;openFilm(x)});article.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openFilm(x)}});cards.append(article)}document.getElementById('empty').style.display=list.length?'none':'block'}document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{kind=b.dataset.kind;document.querySelectorAll('nav button').forEach(n=>n.classList.toggle('active',n===b));render()}));['search','genre','sort'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));render();
</script></body></html>
