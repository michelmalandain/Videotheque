<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CINEMALAND — Destination</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#170a0cdd,#170a0cee),url('agence-voyages.png') center/cover fixed;color:#f8e5bd;font:18px Georgia,serif}header{position:sticky;top:0;z-index:15;text-align:center;padding:14px 15px;backdrop-filter:blur(10px);border-bottom:3px double #d9ad65;background:#210d12e8}h1{font-size:clamp(24px,3vw,38px);color:#f7d38d;margin:10px}main{max-width:1150px;margin:30px auto;padding:20px;background:#170c0de8;border:2px solid #bf9455;border-radius:10px}nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}a,button{color:#ffe0a2}nav a,button{background:#4b1b20;border:1px solid #d6ad67;padding:12px 18px;text-decoration:none;cursor:pointer;font:inherit}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px}select{font:inherit;padding:10px;background:#271315;color:#ffe0a2;border:1px solid #d6ad67}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.card{border:1px solid #ae834a;background:#24161b;padding:12px}.card img{display:block;width:100%;height:285px;object-fit:contain;background:#10090a}.card h3{font-size:19px;color:#f7d38d}.card p{font-size:15px;line-height:1.4}.card button{font-size:15px;width:100%;margin-top:8px}#status{text-align:center;min-height:25px}.modal{border:2px solid #d6ad67;background:#261116;color:#ffe6b8;max-width:650px;width:95%;padding:25px}.modal::backdrop{background:#000c}.modal p{line-height:1.6}</style><style id="cinemaland-correctif-proposition">.bio-proposal-dialog{background:#231016;color:#f6e8cf;border:2px solid #c89442;max-width:550px;width:90%;padding:24px;font:inherit}.bio-proposal-dialog input,.bio-proposal-dialog textarea{display:block;width:100%;margin:7px 0 14px;padding:9px;background:#fff1d9;color:#23130e;border:1px solid #c89442;font:inherit}.bio-proposal-dialog button{background:#7e101a;color:#f5cc7b;border:1px solid #e8b85b;padding:9px 14px;cursor:pointer;font:inherit}.bio-proposal-dialog label{display:block;margin-top:10px}</style>
<script id="cinemaland-correctif-proposition">
function openBioProposal(title,year,kind){
 const d=document.createElement('dialog');d.className='bio-proposal-dialog';
 const heading=document.createElement('h2');heading.textContent='Proposer '+(kind==='Série'?'cette série':'ce film');
 const note=document.createElement('p');note.textContent='Votre proposition sera soumise à la modération.';
 const form=document.createElement('form');
 function field(label,name,value,tag='input'){const l=document.createElement('label');l.textContent=label;const x=document.createElement(tag);x.name=name;x.required=true;if(tag==='input')x.type='text';x.value=value||'';l.append(x);form.append(l);return x;}
 const pseudo=field('Votre pseudonyme','pseudo','');pseudo.maxLength=50;
 const t=field('Titre','title',title);t.maxLength=160;
 const y=field('Année','year',year);y.type='number';y.min='1888';y.max='2100';
 const reason=field('Pourquoi proposer ce titre ?','comment','','textarea');reason.maxLength=1500;
 const trap=document.createElement('input');trap.name='website';trap.tabIndex=-1;trap.style.display='none';form.append(trap);
 const widget=document.createElement('div');form.append(widget);
 const status=document.createElement('p');status.setAttribute('role','status');
 const submit=document.createElement('button');submit.type='submit';submit.textContent='Envoyer pour validation';submit.disabled=true;
 const close=document.createElement('button');close.type='button';close.textContent='Fermer';close.onclick=()=>d.close();
 form.append(submit,status);d.append(close,heading,note,form);document.body.append(d);d.addEventListener('close',()=>d.remove());d.showModal();
 let widgetId=null;
 (async()=>{try{
 const r=await fetch('https://videotheque-admin.michelmalandain.workers.dev/contributions/config');if(!r.ok)throw Error('Service indisponible');const c=await r.json();if(!c.enabled)throw Error('Protection antispam indisponible');
 if(!window.turnstile){await new Promise((resolve,reject)=>{const existing=document.querySelector('script[data-bio-turnstile]');if(existing){const poll=setInterval(()=>{if(window.turnstile){clearInterval(poll);resolve();}},100);setTimeout(()=>{clearInterval(poll);if(!window.turnstile)reject(Error('Antispam indisponible'));},10000);return;}const script=document.createElement('script');script.dataset.bioTurnstile='1';script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';script.onload=resolve;script.onerror=()=>reject(Error('Antispam indisponible'));document.head.append(script);});}
 if(!d.isConnected)return;widgetId=window.turnstile.render(widget,{sitekey:c.sitekey});submit.disabled=false;
 }catch(e){status.textContent=e.message;}})();
 form.addEventListener('submit',async e=>{e.preventDefault();if(widgetId===null)return;const token=window.turnstile.getResponse(widgetId);if(!token){status.textContent='Validez la protection antispam.';return;}submit.disabled=true;status.textContent='Envoi…';try{
 const payload={type:'suggestion',kind,title:t.value,year:Number(y.value),pseudo:pseudo.value,comment:reason.value,stars:0,website:trap.value,token};
 const r=await fetch('https://videotheque-admin.michelmalandain.workers.dev/contributions/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw Error(data.message||'Envoi impossible');status.textContent=data.message;form.reset();t.value=title;y.value=year;
 }catch(err){status.textContent=err.message;}finally{window.turnstile.reset(widgetId);submit.disabled=false;}});
}
</script></head><body>
<header><div id="drapeau" style="font-size:36px;line-height:1" aria-hidden="true"></div><h1 id="titre">Destination CINEMALAND</h1><p>Le cinéma autour du monde</p><nav><a href="agence.html">RETOUR À L'AGENCE</a><a href="index.html">ACCUEIL</a></nav></header><main><div class="controls"><select id="type"><option value="all">Films et séries</option><option value="movies">Films</option><option value="series">Séries</option></select><button id="next">VOIR D'AUTRES TITRES</button></div><p id="status">Chargement des titres…</p><div class="grid" id="grid"></div></main><dialog class="modal" id="detail"><button id="close">FERMER</button><h2 id="detailtitle"></h2><p id="synopsis"></p><p id="detailyear"></p><p>Proposez directement ce titre à CINEMALAND.</p><div id="actions"></div></dialog>
<script>
'use strict';const API='https://videotheque-admin.michelmalandain.workers.dev';const params=new URLSearchParams(location.search);const code=(params.get('pays')||'').toUpperCase();const names=typeof Intl.DisplayNames==='function'?new Intl.DisplayNames(['fr'],{type:'region'}):null;const name=names&&/^[A-Z]{2}$/.test(code)?names.of(code):code;document.getElementById('titre').textContent='Destination : '+name;document.getElementById('drapeau').textContent=/^[A-Z]{2}$/.test(code)?[...code].map(c=>String.fromCodePoint(127397+c.charCodeAt(0))).join(''):'';let page=0,loading=false;const seen=new Set();let maxPages=500;const grid=document.getElementById('grid'),status=document.getElementById('status'),type=document.getElementById('type');document.getElementById('close').onclick=()=>document.getElementById('detail').close();function card(x){const el=document.createElement('article');el.className='card';const img=document.createElement('img');img.alt='Affiche de '+x.title;img.loading='lazy';if(x.poster)img.src='https://image.tmdb.org/t/p/w342'+x.poster;const h=document.createElement('h3');h.textContent=x.title+' ('+(x.year||'année inconnue')+')';const p=document.createElement('p');p.textContent=(x.overview||'Synopsis indisponible').slice(0,190);const b=document.createElement('button');b.textContent='VOIR LA FICHE';b.onclick=()=>{document.getElementById('detailtitle').textContent=x.title;document.getElementById('synopsis').textContent=x.overview||'Synopsis indisponible';document.getElementById('detailyear').textContent=x.kind+' — '+(x.year||'');const a=document.createElement('a');a.href='#';a.textContent='Ajouter à notre cinéma';a.style.cssText='background:none;border:0;padding:0;text-decoration:underline;font-size:15px';a.onclick=e=>{e.preventDefault();openBioProposal(x.title,x.year,x.kind)};document.getElementById('actions').replaceChildren(a);document.getElementById('detail').showModal()};el.append(img,h,p,b);return el}async function load(){if(loading||!/^[A-Z]{2}$/.test(code))return;loading=true;status.textContent='Chargement depuis TMDB…';try{const requestedPage=page+1;const r=await fetch(API+'/voyages-pays?pays='+encodeURIComponent(code)+'&page='+requestedPage+'&_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Service indisponible (HTTP '+r.status+'). Vérifiez que le nouveau Worker est déployé.');const d=await r.json();if(d.message)throw Error(d.message);page=requestedPage;grid.replaceChildren();seen.clear();maxPages=Math.max(Number(d.pages?.movies||0),Number(d.pages?.series||0));const items=[...(type.value==='series'?[]:d.movies||[]),...(type.value==='movies'?[]:d.series||[])];let added=0;items.forEach(x=>{const key=x.kind+':'+x.id;if(!seen.has(key)){seen.add(key);grid.append(card(x));added++}});document.getElementById('next').disabled=page>=maxPages;window.scrollTo({top:0,behavior:'smooth'});status.textContent=added?added+' titres affichés — page '+page+'.':(page>=maxPages?'Fin des résultats.':'Aucun nouveau titre sur cette page (résultats déjà affichés).')}catch(e){status.textContent='Erreur : '+e.message}finally{loading=false}}type.onchange=()=>{page=0;seen.clear();grid.replaceChildren();document.getElementById('next').disabled=false;load()};document.getElementById('next').onclick=load;load();
</script></body></html>
