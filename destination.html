<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CINEMALAND — Destination</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#170a0cdd,#170a0cee),url('agence-voyages.png') center/cover fixed;color:#f8e5bd;font:18px Georgia,serif}header{text-align:center;padding:35px 15px;border-bottom:3px double #d9ad65;background:#210d12e8}h1{font-size:clamp(30px,5vw,55px);color:#f7d38d;margin:10px}main{max-width:1150px;margin:30px auto;padding:20px;background:#170c0de8;border:2px solid #bf9455;border-radius:10px}nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}a,button{color:#ffe0a2}nav a,button{background:#4b1b20;border:1px solid #d6ad67;padding:12px 18px;text-decoration:none;cursor:pointer;font:inherit}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px}select{font:inherit;padding:10px;background:#271315;color:#ffe0a2;border:1px solid #d6ad67}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.card{border:1px solid #ae834a;background:#24161b;padding:12px}.card img{display:block;width:100%;height:285px;object-fit:contain;background:#10090a}.card h3{font-size:19px;color:#f7d38d}.card p{font-size:15px;line-height:1.4}.card button{font-size:15px;width:100%;margin-top:8px}#status{text-align:center;min-height:25px}.modal{border:2px solid #d6ad67;background:#261116;color:#ffe6b8;max-width:650px;width:95%;padding:25px}.modal::backdrop{background:#000c}.modal p{line-height:1.6}</style></head><body>
<header><h1 id="titre">Destination CINEMALAND</h1><p>Le cinéma autour du monde</p><nav><a href="agence.html">RETOUR À L'AGENCE</a><a href="index.html">ACCUEIL</a></nav></header><main><div class="controls"><select id="type"><option value="all">Films et séries</option><option value="movies">Films</option><option value="series">Séries</option></select><button id="next">VOIR D'AUTRES TITRES</button></div><p id="status">Chargement des titres…</p><div class="grid" id="grid"></div></main><dialog class="modal" id="detail"><button id="close">FERMER</button><h2 id="detailtitle"></h2><p id="synopsis"></p><p id="detailyear"></p><p>Pour proposer ce titre à CINEMALAND, utilisez le formulaire « PROPOSER UN FILM » ou « PROPOSER UNE SÉRIE » sur la page correspondante.</p><div id="actions"></div></dialog>
<script>
'use strict';const API='https://videotheque-admin.michelmalandain.workers.dev';const params=new URLSearchParams(location.search);const code=(params.get('pays')||'').toUpperCase();const names=typeof Intl.DisplayNames==='function'?new Intl.DisplayNames(['fr'],{type:'region'}):null;const name=names&&/^[A-Z]{2}$/.test(code)?names.of(code):code;document.getElementById('titre').textContent='Destination : '+name;let page=0,loading=false;const grid=document.getElementById('grid'),status=document.getElementById('status'),type=document.getElementById('type');document.getElementById('close').onclick=()=>document.getElementById('detail').close();function card(x){const el=document.createElement('article');el.className='card';const img=document.createElement('img');img.alt='Affiche de '+x.title;img.loading='lazy';if(x.poster)img.src='https://image.tmdb.org/t/p/w342'+x.poster;const h=document.createElement('h3');h.textContent=x.title+' ('+(x.year||'année inconnue')+')';const p=document.createElement('p');p.textContent=(x.overview||'Synopsis indisponible').slice(0,190);const b=document.createElement('button');b.textContent='VOIR LA FICHE';b.onclick=()=>{document.getElementById('detailtitle').textContent=x.title;document.getElementById('synopsis').textContent=x.overview||'Synopsis indisponible';document.getElementById('detailyear').textContent=x.kind+' — '+(x.year||'');const a=document.createElement('a');a.href=(x.kind==='Série'?'series.html':'films.html');a.textContent='ALLER À LA PAGE '+(x.kind==='Série'?'SÉRIES':'FILMS')+' POUR PROPOSER CE TITRE';document.getElementById('actions').replaceChildren(a);document.getElementById('detail').showModal()};el.append(img,h,p,b);return el}async function load(){if(loading||!/^[A-Z]{2}$/.test(code))return;loading=true;status.textContent='Chargement depuis TMDB…';try{const r=await fetch(API+'/voyages-pays?pays='+encodeURIComponent(code)+'&page='+(page+1));if(!r.ok)throw Error('Service indisponible (HTTP '+r.status+'). Vérifiez que le nouveau Worker est déployé.');const d=await r.json();if(d.message)throw Error(d.message);page++;const items=[...(type.value==='series'?[]:d.movies||[]),...(type.value==='movies'?[]:d.series||[])];items.forEach(x=>grid.append(card(x)));status.textContent=items.length?items.length+' titres chargés pour cette page.':'Aucun titre trouvé.'}catch(e){status.textContent='Erreur : '+e.message}finally{loading=false}}type.onchange=()=>{page=0;grid.replaceChildren();load()};document.getElementById('next').onclick=load;load();
</script></body></html>
