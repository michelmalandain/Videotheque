<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CINEMALAND — Destination</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#170a0cdd,#170a0cee),url('agence-voyages.png') center/cover fixed;color:#f8e5bd;font:18px Georgia,serif}header{position:sticky;top:0;z-index:15;text-align:center;padding:14px 15px;backdrop-filter:blur(10px);border-bottom:3px double #d9ad65;background:#210d12e8}h1{font-size:clamp(24px,3vw,38px);color:#f7d38d;margin:10px}main{max-width:1150px;margin:30px auto;padding:20px;background:#170c0de8;border:2px solid #bf9455;border-radius:10px}nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}a,button{color:#ffe0a2}nav a,button{background:#4b1b20;border:1px solid #d6ad67;padding:12px 18px;text-decoration:none;cursor:pointer;font:inherit}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px}select{font:inherit;padding:10px;background:#271315;color:#ffe0a2;border:1px solid #d6ad67}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.card{border:1px solid #ae834a;background:#24161b;padding:12px}.card img{display:block;width:100%;height:285px;object-fit:contain;background:#10090a}.card h3{font-size:19px;color:#f7d38d}.card p{font-size:15px;line-height:1.4}.card button{font-size:15px;width:100%;margin-top:8px}#status{text-align:center;min-height:25px}.modal{border:2px solid #d6ad67;background:#261116;color:#ffe6b8;max-width:650px;width:95%;padding:25px}.modal::backdrop{background:#000c}.modal p{line-height:1.6} .card img{cursor:pointer;transition:filter .22s ease,box-shadow .22s ease,transform .22s ease;border:2px solid transparent;border-radius:3px}.card img:hover,.card img:focus-visible{filter:brightness(1.13);box-shadow:0 0 12px 3px #e8b85b,0 0 26px 5px #a56c28;transform:scale(1.025);border-color:#e8b85b;outline:none}</style><style id="cinemaland-correctif-proposition">.bio-proposal-dialog{background:#231016;color:#f6e8cf;border:2px solid #c89442;max-width:550px;width:90%;padding:24px;font:inherit}.bio-proposal-dialog input,.bio-proposal-dialog textarea{display:block;width:100%;margin:7px 0 14px;padding:9px;background:#fff1d9;color:#23130e;border:1px solid #c89442;font:inherit}.bio-proposal-dialog button{background:#7e101a;color:#f5cc7b;border:1px solid #e8b85b;padding:9px 14px;cursor:pointer;font:inherit}.bio-proposal-dialog label{display:block;margin-top:10px}</style>
<script id="cinemaland-correctif-proposition">
function openBioProposal(title,year,kind){
 const d=document.createElement('dialog');d.className='bio-proposal-dialog';
 const heading=document.createElement('h2');heading.textContent='Proposer '+(kind==='Série'?'cette série':'ce film');
 const note=document.createElement('p');note.textContent='Votre proposition sera soumise à la modération.';
 const form=document.createElement('form');
 function field(label,name,value,tag='input'){const l=document.createElement('label');l.textContent=label;const x=document.createElement(tag);x.name=name;x.required=true;if(tag==='input')x.type='text';x.value=value||'';l.append(x);form.append(l);return x;}
 const pseudo=field('Votre pseudonyme','pseudo','');pseudo.maxLength=50;
 const t=field('Titre','title',title);t.maxLength=160;
 const y=field('Année','year',year);y.type='number';y.min='1888';y.max='2100';
 const reason=field('Pourquoi proposer ce titre ?','comment','','textarea');reason.maxLength=1500;
 const trap=document.createElement('input');trap.name='website';trap.tabIndex=-1;trap.style.display='none';form.append(trap);
 const widget=document.createElement('div');form.append(widget);
 const status=document.createElement('p');status.setAttribute('role','status');
 const submit=document.createElement('button');submit.type='submit';submit.textContent='Envoyer pour validation';submit.disabled=true;
 const close=document.createElement('button');close.type='button';close.textContent='Fermer';close.onclick=()=>d.close();
 form.append(submit,status);d.append(close,heading,note,form);document.body.append(d);d.addEventListener('close',()=>d.remove());d.showModal();
 let widgetId=null;
 (async()=>{try{
 const r=await fetch('https://videotheque-admin.michelmalandain.workers.dev/contributions/config');if(!r.ok)throw Error('Service indisponible');const c=await r.json();if(!c.enabled)throw Error('Protection antispam indisponible');
 if(!window.turnstile){await new Promise((resolve,reject)=>{const existing=document.querySelector('script[data-bio-turnstile]');if(existing){const poll=setInterval(()=>{if(window.turnstile){clearInterval(poll);resolve();}},100);setTimeout(()=>{clearInterval(poll);if(!window.turnstile)reject(Error('Antispam indisponible'));},10000);return;}const script=document.createElement('script');script.dataset.bioTurnstile='1';script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';script.onload=resolve;script.onerror=()=>reject(Error('Antispam indisponible'));document.head.append(script);});}
 if(!d.isConnected)return;widgetId=window.turnstile.render(widget,{sitekey:c.sitekey});submit.disabled=false;
 }catch(e){status.textContent=e.message;}})();
 form.addEventListener('submit',async e=>{e.preventDefault();if(widgetId===null)return;const token=window.turnstile.getResponse(widgetId);if(!token){status.textContent='Validez la protection antispam.';return;}submit.disabled=true;status.textContent='Envoi…';try{
 const payload={type:'suggestion',kind,title:t.value,year:Number(y.value),pseudo:pseudo.value,comment:reason.value,stars:0,website:trap.value,token};
 const r=await fetch('https://videotheque-admin.michelmalandain.workers.dev/contributions/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw Error(data.message||'Envoi impossible');status.textContent=data.message;form.reset();t.value=title;y.value=year;
 }catch(err){status.textContent=err.message;}finally{window.turnstile.reset(widgetId);submit.disabled=false;}});
}
</script><style id="destination-photos-pays">

<header><div class="signature">CINEMA Malandain</div><div id="drapeau" style="font-size:36px;line-height:1" aria-hidden="true"></div><h1 id="titre">Destination CINEMALAND</h1><p>Le cinéma autour du monde</p><nav><a href="agence.html">RETOUR À L'AGENCE</a><a href="index.html">ACCUEIL</a></nav></header><main><div class="controls"><select id="type"><option value="all">Films et séries</option><option value="movies">Films</option><option value="series">Séries</option></select><button id="next">VOIR D'AUTRES TITRES</button></div><p id="status">Chargement des titres…</p><div class="grid" id="grid"></div></main><dialog class="modal" id="detail"><button id="close">FERMER</button><h2 id="detailtitle"></h2><p id="synopsis"></p><p id="detailyear"></p><p>Proposez directement ce titre à CINEMALAND.</p><div id="actions"></div></dialog>
<script>
'use strict';const API='https://videotheque-admin.michelmalandain.workers.dev';const params=new URLSearchParams(location.search);const code=(params.get('pays')||'').toUpperCase();const names=typeof Intl.DisplayNames==='function'?new Intl.DisplayNames(['fr'],{type:'region'}):null;const name=names&&/^[A-Z]{2}$/.test(code)?names.of(code):code;document.getElementById('titre').textContent='Destination : '+name;const flagBox=document.getElementById('drapeau');if(/^[A-Z]{2}$/.test(code)){const flag=document.createElement('img');flag.src='https://flagcdn.com/w80/'+code.toLowerCase()+'.png';flag.alt='Drapeau : '+name;flag.width=48;flag.style.cssText='display:block;width:48px;height:32px;object-fit:cover;margin:0 auto;border:1px solid #e5c487;box-shadow:0 2px 9px #0009';flag.onerror=()=>{flagBox.textContent=code};flagBox.replaceChildren(flag)}let page=0,loading=false;const seen=new Set();let maxPages=500;const grid=document.getElementById('grid'),status=document.getElementById('status'),type=document.getElementById('type');document.getElementById('close').onclick=()=>document.getElementById('detail').close();function card(x){const el=document.createElement('article');el.className='card';const img=document.createElement('img');img.alt='Affiche de '+x.title;img.loading='lazy';if(x.poster)img.src='https://image.tmdb.org/t/p/w342'+x.poster;const h=document.createElement('h3');h.textContent=x.title+' ('+(x.year||'année inconnue')+')';const p=document.createElement('p');p.textContent=(x.overview||'Synopsis indisponible').slice(0,190);img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label','Voir la fiche de '+x.title);img.onclick=()=>{document.getElementById('detailtitle').textContent=x.title;document.getElementById('synopsis').textContent=x.overview||'Synopsis indisponible';document.getElementById('detailyear').textContent=x.kind+' — '+(x.year||'');const proposer=document.createElement('button');proposer.type='button';proposer.textContent='PROPOSER CE TITRE';proposer.onclick=()=>openBioProposal(x.title,x.year,x.kind);const ajouter=document.createElement('a');ajouter.textContent='Ajouter à notre cinéma (administration)';ajouter.style.cssText='display:inline-block;margin:14px 0 0 14px;background:none;border:0;padding:0;text-decoration:underline;font-size:15px;color:#f7d38d';ajouter.href=API+'/?'+new URLSearchParams({title:x.title,year:x.year||'',kind:x.kind}).toString();ajouter.target='_blank';ajouter.rel='noopener noreferrer';if(!/^\d{4}$/.test(String(x.year||'')))ajouter.style.display='none';document.getElementById('actions').replaceChildren(proposer,ajouter);document.getElementById('detail').showModal()};img.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();img.click()}};el.append(img,h,p);return el}async function load(){if(loading||!/^[A-Z]{2}$/.test(code))return;loading=true;status.textContent='Chargement depuis TMDB…';try{const requestedPage=page+1;const r=await fetch(API+'/voyages-pays?pays='+encodeURIComponent(code)+'&page='+requestedPage+'&_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Service indisponible (HTTP '+r.status+'). Vérifiez que le nouveau Worker est déployé.');const d=await r.json();if(d.message)throw Error(d.message);page=requestedPage;grid.replaceChildren();seen.clear();maxPages=Math.max(Number(d.pages?.movies||0),Number(d.pages?.series||0));const items=[...(type.value==='series'?[]:d.movies||[]),...(type.value==='movies'?[]:d.series||[])];let added=0;items.forEach(x=>{const key=x.kind+':'+x.id;if(!seen.has(key)){seen.add(key);grid.append(card(x));added++}});document.getElementById('next').disabled=page>=maxPages;window.scrollTo({top:0,behavior:'smooth'});status.textContent=added?added+' titres affichés — page '+page+'.':(page>=maxPages?'Fin des résultats.':'Aucun nouveau titre sur cette page (résultats déjà affichés).')}catch(e){status.textContent='Erreur : '+e.message}finally{loading=false}}type.onchange=()=>{page=0;seen.clear();grid.replaceChildren();document.getElementById('next').disabled=false;load()};document.getElementById('next').onclick=load;load();
</script><style>header.bandeau-italie::before{background-image:linear-gradient(90deg,rgba(18,8,12,.70),rgba(18,8,12,.30),rgba(18,8,12,.70)),var(--italie-colisee),var(--italie-saint-pierre);background-size:100% 100%,50% 100%,50% 100%;background-position:center,left center,right center;background-repeat:no-repeat;}</style><script id="photos-pays-wikimedia">
/* Essai limité à trois pays. Photos Wikimedia Commons, sans clé ni Worker. */
(async function(){
 const pays=new URLSearchParams(location.search).get('pays')?.toUpperCase();
 const recherches={FR:'Paris panorama Eiffel Tower skyline',JP:'Mount Fuji Japan panorama landscape'};
 const photosChoisies={FR:'File:Eiffel Tower seen from the Palais de Chaillot.jpg',JP:'File:Mount Fuji April Cherry Blossom.jpg'};
 if(pays==='IT'){
   // Deux photographies distinctes, une pour chaque moitié du bandeau italien.
   const sujets=['Colosseum Rome exterior photograph','Saint Peters Square Vatican Rome photograph'];
   async function photoPour(sujet){
     const q=new URLSearchParams({action:'query',format:'json',origin:'*',generator:'search',gsrsearch:'filetype:bitmap '+sujet,gsrnamespace:'6',gsrlimit:'30',prop:'imageinfo',iiprop:'url|size|mime',iiurlwidth:'1200'});
     const r=await fetch('https://commons.wikimedia.org/w/api.php?'+q,{signal:AbortSignal.timeout(8500)});
     if(!r.ok)throw Error('Wikimedia indisponible');
     const d=await r.json();
     const candidats=Object.values(d.query?.pages||{}).flatMap(p=>(p.imageinfo||[]).map(i=>({title:p.title,...i})))
       .filter(i=>i.width>=800&&i.height>=400&&i.thumburl&&/^image\/(jpeg|png|webp)$/.test(i.mime||''));
     const mots=sujet.startsWith('Colosseum')?/colosseum|coliseum|colosseo/i:/saint.peter|st.peter|san.pietro|petersplatz/i;
     candidats.sort((a,b)=>Number(mots.test(b.title))-Number(mots.test(a.title)) || Math.abs(a.width/a.height-1.7)-Math.abs(b.width/b.height-1.7));
     if(!candidats.length)throw Error('Aucune photo');
     const url=candidats[0].thumburl;
     await new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=reject;img.src=url;});
     return 'url("'+url.replace(/"/g,'%22')+'")';
   }
   try{
     const [colisee,saintPierre]=await Promise.all(sujets.map(photoPour));
     const h=document.querySelector('header');
     h.style.setProperty('--italie-colisee',colisee);
     h.style.setProperty('--italie-saint-pierre',saintPierre);
     h.classList.add('bandeau-italie');
   }catch(e){/* Décor de secours inchangé. */}
   return;
 }
 if(photosChoisies[pays]){
   try{
     const q=new URLSearchParams({action:'query',format:'json',origin:'*',titles:photosChoisies[pays],prop:'imageinfo',iiprop:'url',iiurlwidth:'1600'});
     const r=await fetch('https://commons.wikimedia.org/w/api.php?'+q,{signal:AbortSignal.timeout(8500)});
     if(!r.ok)throw Error('Photographie indisponible');
     const d=await r.json();
     const photo=Object.values(d.query?.pages||{})[0]?.imageinfo?.[0]?.thumburl;
     if(!photo)throw Error('Photographie introuvable');
     const img=new Image();img.onload=()=>document.querySelector('header')?.style.setProperty('--pays-photo','url("'+photo.replace(/"/g,'%22')+'")');img.src=photo;
   }catch(e){/* Conserver le décor de secours. */}
   return;
 }
 if(!recherches[pays])return;
 try{
   const q=new URLSearchParams({action:'query',format:'json',origin:'*',generator:'search',gsrsearch:'filetype:bitmap '+recherches[pays],gsrnamespace:'6',gsrlimit:'25',prop:'imageinfo',iiprop:'url|size|mime',iiurlwidth:'1600'});
   const r=await fetch('https://commons.wikimedia.org/w/api.php?'+q,{signal:AbortSignal.timeout(8500)});
   if(!r.ok)throw new Error('Wikimedia indisponible');
   const d=await r.json();
   const candidats=Object.values(d.query?.pages||{}).flatMap(p=>(p.imageinfo||[]).map(i=>({title:p.title,...i})))
     .filter(i=>i.width>=1000&&i.height>=250&&i.width/i.height>=1.6&&i.thumburl&&/^image\/(jpeg|png|webp)$/.test(i.mime||''));
   if(!candidats.length)return;
   candidats.sort((a,b)=>Math.abs(a.width/a.height-2.8)-Math.abs(b.width/b.height-2.8));
   const url=candidats[0].thumburl;
   const img=new Image();img.onload=()=>document.querySelector('header')?.style.setProperty('--pays-photo','url("'+url.replace(/"/g,'%22')+'")');img.src=url;
 }catch(e){/* Le bandeau actuel reste visible en cas d'erreur. */}
})();
</script></body></html>
