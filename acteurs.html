</style></head><body><header><h1>CINÉMA FRANÇAIS</h1><p>ACTEURS DU CINÉMA FRANÇAIS</p></header><div class="mondial-tapis" aria-label="Affiches de la vidéothèque en défilement"><div class="mondial-tapis-track" id="mondial-tapis-track"></div></div><nav><a href="index.html?hall=1">HALL</a><a href="films.html">FILMS</a><a href="series.html">SÉRIES</a><a href="acteurs.html" aria-current="page">ACTEURS</a><a href="realisateurs.html">RÉALISATEURS</a><a href="admin2-acteurs.html">ADMINISTRATION</a></nav><main><div class="controls"><input id="filter" placeholder="Filtrer la liste par nom" aria-label="Filtrer par nom"><span id="count"></span></div><p id="status">Chargement du catalogue…</p><div id="cards" class="cards"></div></main><dialog id="actor-detail" class="actor-dialog"><button type="button" class="actor-close" id="actor-close">RETOUR</button><div id="actor-content"></div></dialog><script src="catalogue.js"></script>
<script>
const ROLE='actor', all=window.CINEMALAND_CATALOGUE;
const cards=document.getElementById('cards'), status=document.getElementById('status'), counter=document.getElementById('count');
const entries=new Map();
function add(person,film){
 const name=typeof person==='string'?person:(person?.name||'');
 if(!name.trim())return;
 const rawId=person&&typeof person==='object'?(person.tmdb_id||person.id):null;
  const key=/^[1-9]\d*$/.test(String(rawId||''))?'tmdb:'+rawId:'name:'+name.trim().toLocaleLowerCase('fr');
 let row=entries.get(key);
 if(!row){row={name:name.trim(),id:null,photo:null,nationality:null,frProduction:false,films:new Set()};entries.set(key,row)}
 if(person && typeof person==='object'){
  row.id ||=person.tmdb_id||person.id||null;
  row.photo ||=person.profile_path||person.photo||null;
   row.nationality ||=person.nationality||person.nationalite||null;
 }
 row.frProduction ||= Array.isArray(film.production_countries)&&film.production_countries.some(c=>String(c?.iso_3166_1||c?.code||c).toUpperCase()==='FR');
 row.films.add([film.kind||film.type||'',film.title||'',film.year||''].join('|'));
}
if(Array.isArray(all)){
 for(const f of all){
  const film=f||{};
  if(ROLE==='actor'){for(const p of (film.cast||film.actors||[]))add(p,film);}
  else {for(const p of [...(film.directors||[]),...(film.creators||[])])add(p,film);}
 }
}
// Classement par patronyme, sans modifier le nom affiché ni l'identifiant TMDB.
function clePatronyme(nom){
 const mots=String(nom||'').trim().split(/\s+/).filter(Boolean);
 if(mots.length<2)return mots.join(' ');
 let debut=mots.length-1;
 // Les particules qui précèdent le patronyme restent avec lui.
 while(debut>0&&/^(de|du|des|del|della|di|da|van|von|der|den|le|la|les|al|el|bin)$/i.test(mots[debut-1]))debut--;
 return mots.slice(debut).join(' ')+' '+mots.slice(0,debut).join(' ');
}
const people=[...entries.values()].sort((a,b)=>clePatronyme(a.name).localeCompare(clePatronyme(b.name),'fr',{sensitivity:'base'})||a.name.localeCompare(b.name,'fr',{sensitivity:'base'}));
const CM_PAGE_SIZE=36;
let cmCurrentPage=1;
const cmPagination=document.createElement('nav');
cmPagination.className='cm-pagination';
cmPagination.setAttribute('aria-label','Pagination des personnes');
cards.insertAdjacentElement('afterend',cmPagination);
function cmRenderPagination(total){
 cmPagination.replaceChildren();
 const pages=Math.max(1,Math.ceil(total/CM_PAGE_SIZE));
 cmCurrentPage=Math.min(Math.max(cmCurrentPage,1),pages);
 if(pages===1){cmPagination.hidden=true;return;}
 cmPagination.hidden=false;
 const previous=document.createElement('button');previous.type='button';previous.textContent='Précédent';previous.disabled=cmCurrentPage===1;
 previous.onclick=()=>{cmCurrentPage--;draw();document.querySelector('.controls').scrollIntoView({block:'start'});};
 const label=document.createElement('span');label.textContent='Page '+cmCurrentPage+' / '+pages;
 const next=document.createElement('button');next.type='button';next.textContent='Suivant';next.disabled=cmCurrentPage===pages;
 next.onclick=()=>{cmCurrentPage++;draw();document.querySelector('.controls').scrollIntoView({block:'start'});};
 cmPagination.append(previous,label,next);
}
function draw(){
 const term=document.getElementById('filter').value.trim().toLocaleLowerCase('fr');
 cards.replaceChildren();
 const matching=people.filter(x=>(cmEstFrancais(x.nationality)||(!x.nationality&&x.frProduction))&&x.name.toLocaleLowerCase('fr').includes(term));
 counter.textContent=matching.length+' acteurs';
 cmRenderPagination(matching.length);
 for(const person of matching.slice((cmCurrentPage-1)*CM_PAGE_SIZE,cmCurrentPage*CM_PAGE_SIZE)){
  const b=document.createElement('button');b.type='button';b.className='card';
  const name=document.createElement('strong');name.textContent=person.name;
  const sub=document.createElement('small');sub.textContent=person.films.size+' titre(s) dans notre vidéothèque';
  const photo=document.createElement('div');photo.className='portrait-tmdb';
  const img=document.createElement('img');img.alt='Portrait de '+person.name;img.loading='lazy';
  img.onerror=()=>{img.style.display='none';photo.classList.add('sans-photo')};
  photo.append(img);b.append(photo);
  if(person.photo)img.src=cmPhotoUrl(person.photo,'w185');
  else {img.style.display='none';photo.classList.add('sans-photo');}
  person.node=img;person.photoBox=photo;
  b.append(name,sub);
  b.onclick=()=>openActorDetail(person);
  cards.append(b);
 }
}
document.getElementById('filter').addEventListener('input',()=>{cmCurrentPage=1;draw();});
status.textContent=Array.isArray(all)?(people.length?'':'Aucune personne trouvée dans les crédits du catalogue.'):'Catalogue indisponible : placer catalogue.js avec ces pages.';
draw();
// Compléter les photos manquantes depuis le service TMDB déjà utilisé par CINEMALAND.
// L'identifiant TMDB prime toujours sur les homonymes ; ne jamais attribuer
// une photographie à une personne si le nom exact est ambigu.
const PERSON_API='https://videotheque-admin.michelmalandain.workers.dev';

// La liste française est déterminée par la nationalité de la personne,
// indépendamment des pays de production des œuvres.
function cmEstFrancais(value){
 const v=String(value?.iso_3166_1||value?.code||value||'').trim().toLowerCase();
 return ['fr','fx','fra','france','français','française','french'].includes(v);
}
async function cmCompleterNationalites(){
 const pending=people.filter(p=>!p.nationality&&p.id);
 let index=0,done=0;
 await Promise.all(Array.from({length:Math.min(5,pending.length)},async()=>{
  while(index<pending.length){
   const person=pending[index++];
   try{
    const response=await fetch(PERSON_API+'/person-detail?id='+encodeURIComponent(person.id));
    if(response.ok){const info=await response.json();const detail=info.person||info.details||info;person.nationality=detail.nationality||detail.nationalite||null;}
   }catch(e){}
   done++;
   if(done%15===0||done===pending.length){draw();status.textContent='Vérification des nationalités : '+done+'/'+pending.length;}
  }
 }));
 status.textContent='';draw();
}
cmCompleterNationalites();

// Affichage local des codes ISO et résolution des photos hébergées sur CINEMALAND.
function cmNationalite(value){
 const v=String(value?.iso_3166_1||value?.code||value||'').trim();if(!v)return '';
 const map={FR:'française',FX:'française',BE:'belge',CH:'suisse',CA:'canadienne',US:'américaine',GB:'britannique',IT:'italienne',ES:'espagnole',DE:'allemande',PT:'portugaise',NL:'néerlandaise',LU:'luxembourgeoise',IE:'irlandaise',AU:'australienne',AT:'autrichienne',BR:'brésilienne',CN:'chinoise',JP:'japonaise',KR:'sud-coréenne',MA:'marocaine',MX:'mexicaine',PL:'polonaise',SE:'suédoise',NO:'norvégienne',DK:'danoise',GR:'grecque',IN:'indienne',TR:'turque'};
 return map[v.toUpperCase()]||v;
}
function cmPhotoUrl(value,size='w342'){
 const p=String(value||'').trim();if(!p)return '';
 if(/^https?:\/\//i.test(p))return p;
 if(p.startsWith('photos/')||p.startsWith('/photos/')){const u=new URL(p.replace(/^\//,''),location.origin+'/');u.searchParams.set('v',String(Date.now()));return u.href;}
 return 'https://image.tmdb.org/t/p/'+size+(p.startsWith('/')?p:'/'+p);
}

const normalized=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('fr').trim();
function setPhoto(person,profile){
 if(!profile)return false;
 const path=String(profile).trim();
 if(!path)return false;
 const url=cmPhotoUrl(path,'w185');
 person.photo=url; // Conserver le portrait lors d'une recherche ou d'un nouveau rendu.
 if(person.node){
  person.node.src=url;
  person.node.style.display='block';
  person.photoBox?.classList.remove('sans-photo');
 }
 return true;
}
async function resolvePortrait(person){
 if(person.photo)return;
 try{
  // Utiliser d'abord l'identifiant TMDB déjà enregistré : pas de risque d'homonyme.
  if(person.id){
   const detail=await fetch(PERSON_API+'/person-detail?id='+encodeURIComponent(person.id));
   if(detail.ok){
    const d=await detail.json(),info=d.person||d.details||d;
    if(setPhoto(person,info.profile_path||info.photo||info.profile))return;
   }
  }
  const parts=person.name.trim().split(/\s+/);
  const last=parts.pop(),first=parts.join(' ');
  const response=await fetch(PERSON_API+'/person-search?'+new URLSearchParams(first?{first,last}:{last}));
  if(!response.ok)return;
  const data=await response.json();
  const exact=(data.people||[]).filter(p=>normalized(p.name)===normalized(person.name));
  const match=person.id?exact.find(p=>String(p.id)===String(person.id)):(exact.length===1?exact[0]:null);
  if(!match)return;
  if(match.id&&!person.id)person.id=match.id;
  if(setPhoto(person,match.profile_path||match.photo||match.profile))return;
  if(match.id){
   const detail=await fetch(PERSON_API+'/person-detail?id='+encodeURIComponent(match.id));
   if(detail.ok){const d=await detail.json(),info=d.person||d.details||d;setPhoto(person,info.profile_path||info.photo||info.profile)}
  }
 }catch(e){/* Un service indisponible ne doit pas bloquer les tickets. */}
}
async function loadPortraits(){
 const queue=people.filter(p=>!p.photo);
 let i=0;
 await Promise.all(Array.from({length:Math.min(3,queue.length)},async()=>{
  while(i<queue.length){const p=queue[i++];await resolvePortrait(p)}
 }));
}

const actorDialog=document.getElementById('actor-detail');
const actorContent=document.getElementById('actor-content');
// Retour à la liste et à son filtre, sans quitter la page mondiale.
document.getElementById('actor-close').onclick=()=>actorDialog.close();
// Données biographiques : TMDB uniquement. Aucun appel à Wikidata.
const actorDate=v=>{const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:(v||'Non renseignée')};
function actorSection(title){const sec=document.createElement('section');sec.className='actor-section';const h=document.createElement('h3');h.textContent=title;sec.append(h);actorContent.append(sec);return sec}
async function openActorDetail(person){
 actorContent.replaceChildren();const waiting=document.createElement('p');waiting.textContent='Chargement de la fiche…';actorContent.append(waiting);actorDialog.showModal();
 try{
  let id=person.id;

  const r=await fetch(PERSON_API+'/person-detail?id='+encodeURIComponent(id));if(!r.ok)throw Error('Fiche indisponible');const p=await r.json();actorContent.replaceChildren();
  const profile=document.createElement('div');profile.className='actor-profile';const photo=document.createElement('div');if(p.profile_path||p.photo||p.profile||person.photo){const img=document.createElement('img');img.alt='Portrait de '+p.name;const candidates=[p.photo,p.profile,person.photo,p.profile_path].filter(Boolean);const path=candidates.find(v=>/^\/?photos\//i.test(String(v)))||candidates[0];img.src=cmPhotoUrl(path,'w342');photo.append(img)}else photo.textContent='Photographie indisponible';profile.append(photo);
  const facts=document.createElement('div');const h=document.createElement('h2');h.textContent=p.name||person.name;facts.append(h);
  for(const [label,value] of [['Naissance',p.birthday?actorDate(p.birthday):null],['Lieu de naissance',p.place_of_birth],['Nationalité',cmNationalite(p.nationality||p.nationalite)],['Décès',p.deathday?actorDate(p.deathday):null],['Profession',p.known_for_department==='Acting'?'Acteur / Actrice':p.known_for_department]]){const line=document.createElement('p');const bold=document.createElement('strong');bold.textContent=label+' : ';line.append(bold,document.createTextNode(value??''));facts.append(line)}profile.append(facts);actorContent.append(profile);
  // Suppression administrative d'un identifiant TMDB, jamais d'un nom entier.
  const adminArea=document.createElement('div');adminArea.style.cssText='margin:15px 0;padding:13px;border:1px solid #a88a54;border-radius:7px;background:#09251d';
  const tmdbLabel=document.createElement('p');tmdbLabel.textContent='Identifiant TMDB : '+id;adminArea.append(tmdbLabel);
  const localInfo=document.createElement('p');localInfo.textContent='Vérification des titres du catalogue avant toute suppression.';adminArea.append(localInfo);
  const removeBtn=document.createElement('button');removeBtn.type='button';removeBtn.textContent='SUPPRIMER DE CINEMALAND (ADMINISTRATION)';removeBtn.style.cssText='padding:9px 13px;border:1px solid #d7b36d;background:#68232b;color:#ffe6af;cursor:pointer;font:inherit;border-radius:5px';adminArea.append(removeBtn);
  const removalStatus=document.createElement('p');removalStatus.setAttribute('role','status');adminArea.append(removalStatus);
  removeBtn.onclick=async()=>{

   removeBtn.disabled=true;removalStatus.textContent='Vérification des films et séries dans le catalogue…';
   try{const response=await fetch(PERSON_API+'/person-exclusions',{method:'POST',headers:{'Authorization':'Bearer '+password,'Content-Type':'application/json'},body:JSON.stringify({id:String(id),name:p.name||person.name,role:'actor'})});const data=await response.json();
    if(!response.ok){removalStatus.textContent=(data.message||'Suppression refusée.')+(data.titles?.length?' Titres : '+data.titles.join(', '):'');return}
    removalStatus.textContent='Fiche TMDB '+id+' exclue définitivement de CINEMALAND.';removeBtn.remove();person.id=null;actorDialog.close();
   }catch(e){removalStatus.textContent='Erreur de connexion : aucune suppression effectuée.'}finally{removeBtn.disabled=false}
  };
  actorContent.append(adminArea);
  const biography=actorSection('BIOGRAPHIE');biography.classList.add('bio-readable');
  // Conserver le texte TMDB, ses paragraphes et ses sauts de ligne.
  // Si TMDB fournit un seul bloc très long, l'aérer entre les phrases sans modifier les mots.
  const rawBio=String(p.biography||'').trim()||'Biographie non disponible sur TMDB.';
  const sections=rawBio.split(/\n\s*\n/).flatMap(block=>{
   const lines=block.split(/\n/).map(x=>x.trim()).filter(Boolean);
   return lines.flatMap(line=>{
    if(line.length<550)return [line];
    const sentences=line.match(/[^.!?]+(?:[.!?]+(?=\s|$)|$)/g)||[line];
    const groups=[];let current='';
    for(const sentence of sentences){const part=sentence.trim();if(!part)continue;if(current&&current.length+part.length>440){groups.push(current);current=''}current+=(current?' ':'')+part}

  }catch(e){status.textContent=e.message}
   cmArrangeActorProfile(id);
 }catch(e){actorContent.replaceChildren();const error=document.createElement('p');error.textContent=e.message;actorContent.append(error)}
}



// CINEMALAND : enrichissement facultatif par identifiant TMDB, sans rapprochement par homonyme.
async function cmActorFamily(actorId,host){
 const message=document.createElement('p');message.className='cm-family-note';message.textContent='Recherche des informations familiales publiques…';host.append(message);
 const safeId=String(actorId).replace(/[^0-9]/g,'');
 const query=`SELECT DISTINCT ?relation ?person ?personLabel ?tmdb ?start ?end WHERE {
   ?subject wdt:P4985 "${safeId}" .
   { VALUES (?property ?relation) {(wdt:P22 "Père") (wdt:P25 "Mère") (wdt:P40 "Enfant") (wdt:P3373 "Fratrie")}
     ?subject ?property ?person . }
   UNION { VALUES (?statementProperty ?valueProperty ?relation) {(p:P26 ps:P26 "Conjoint") (p:P451 ps:P451 "Compagne ou compagnon")}
     ?subject ?statementProperty ?statement . ?statement ?valueProperty ?person .
     OPTIONAL { ?statement pq:P580 ?start . } OPTIONAL { ?statement pq:P582 ?end . } }
   UNION { ?person wdt:P40 ?subject . ?person wdt:P21 ?gender .
     BIND(IF(?gender=wd:Q6581097,"Père",IF(?gender=wd:Q6581072,"Mère","Parent")) AS ?relation) }
   OPTIONAL { ?person wdt:P4985 ?tmdb . }
   SERVICE wikibase:label { bd:serviceParam wikibase:language "fr,en" . }
 } LIMIT 100`;
 function year(value){const match=String(value||'').match(/^[+-]?(\d{4})/);return match?match[1]:''}
 function render(label,values){if(!values.length)return;const row=document.createElement('div');row.className='cm-family-line';const heading=document.createElement('strong');heading.textContent=label;const content=document.createElement('span');values.forEach((v,i)=>{if(i)content.append(document.createTextNode(', '));if(v.tmdb){const b=document.createElement('button');b.type='button';b.className='cm-family-link';b.textContent=v.name;b.title='Ouvrir la fiche de '+v.name;b.onclick=()=>{actorDialog.close();openActorDetail({name:v.name,id:v.tmdb,photo:null,films:new Set()})};content.append(b)}else content.append(document.createTextNode(v.name));const dates=[year(v.start),year(v.end)];if(dates.some(Boolean))content.append(document.createTextNode(' ('+(dates[0]||'?')+'–'+(dates[1]||'')+')'))});row.append(heading,content);host.append(row)}
 try{
  const response=await fetch('https://query.wikidata.org/sparql?'+new URLSearchParams({query,format:'json'}),{headers:{Accept:'application/sparql-results+json'},signal:AbortSignal.timeout(12000)});
  if(!response.ok)throw Error('Source indisponible');const data=await response.json();if(!host.isConnected)return;
  const groups=new Map();
  for(const row of data.results?.bindings||[]){const type=row.relation?.value,name=row.personLabel?.value,personId=row.person?.value;if(!type||!name||/^Q\d+$/.test(name))continue;
   const values=groups.get(type)||[];const key=personId||name;const current=values.find(v=>v.key===key);const item={key,name,tmdb:row.tmdb?.value,start:row.start?.value,end:row.end?.value};
   if(!current)values.push(item);else {current.tmdb ||=item.tmdb;current.start ||=item.start;current.end ||=item.end}groups.set(type,values);
  }
  message.remove();
  for(const type of ['Père','Mère','Parent','Fratrie'])render(type,groups.get(type)||[]);
  for(const [type,oldLabel,otherLabel] of [['Conjoint','Anciens conjoints','Conjoints (situation non précisée)'],['Compagne ou compagnon','Anciennes compagnes et anciens compagnons','Compagnes et compagnons (situation non précisée)']]){
   const values=groups.get(type)||[];render(oldLabel,values.filter(v=>v.end));render(otherLabel,values.filter(v=>!v.end));
  }
  render('Enfant',groups.get('Enfant')||[]);
  if(!groups.size){message.textContent='Aucun lien familial vérifié disponible dans Wikidata.';host.append(message)}
 }catch(e){if(host.isConnected)message.textContent='Informations familiales indisponibles pour le moment.'}
}
async function cmActorAwards(actorId,host){
 try{
  const query=`SELECT DISTINCT ?awardLabel WHERE { ?subject wdt:P4985 "${String(actorId).replace(/[^0-9]/g,'')}"; wdt:P166 ?award . SERVICE wikibase:label { bd:serviceParam wikibase:language "fr,en". } } LIMIT 25`;
  const response=await fetch('https://query.wikidata.org/sparql?'+new URLSearchParams({query,format:'json'}),{headers:{Accept:'application/sparql-results+json'},signal:AbortSignal.timeout(7000)});
  if(!response.ok)throw Error('Source indisponible');const data=await response.json();if(!host.isConnected)return;
  const awards=[...new Set((data.results?.bindings||[]).map(x=>x.awardLabel?.value).filter(x=>x&&!/^Q\d+$/.test(x)))];

}

// CINEMALAND : fiche d’œuvre depuis la filmographie, harmonisée vert et or.
function ouvrirOeuvreFilmographie(credit, titre){
 const type=(credit.media_type==='tv'||credit.mediaType==='tv'||credit.type==='tv')?'tv':'movie';
 const id=credit.id||credit.tmdb_id||credit.tmdbId;
 const d=document.createElement('dialog');d.className='fiche-oeuvre-harmonie';
 d.style.cssText='width:min(850px,94vw);max-width:94vw;max-height:90vh;overflow:auto;background:linear-gradient(140deg,#164c39,#071e17);color:#f5e6c5;border:2px solid #d7b36d;border-radius:10px;padding:24px;box-shadow:0 20px 80px #000c';
 const retour=document.createElement('button');retour.type='button';retour.textContent='Retour à la filmographie';retour.style.cssText='float:right;background:#235941;color:#ffe6af;border:1px solid #d7b36d;border-radius:5px;padding:9px 13px;cursor:pointer;font:inherit';retour.onclick=()=>d.close();
 const h=document.createElement('h2');h.textContent=titre;h.style.cssText='color:#ffe0a0;clear:both;padding-top:12px';
 const row=document.createElement('div');row.style.cssText='display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start';
 const img=document.createElement('img');img.alt='Affiche de '+titre;img.style.cssText='width:min(220px,100%);max-height:340px;object-fit:contain;border:2px solid #d7b36d';
 if(credit.poster_path){img.src='https://image.tmdb.org/t/p/w500'+credit.poster_path;row.append(img)}
 const info=document.createElement('div');info.style.cssText='flex:1;min-width:220px;line-height:1.6';
 const meta=document.createElement('p');meta.textContent=String(credit.date||credit.release_date||credit.first_air_date||'').slice(0,4)+' · '+(type==='tv'?'Série':'Film');
 const label=document.createElement('h3');label.textContent='Synopsis';label.style.color='#ffe0a0';
 const synopsis=document.createElement('p');synopsis.textContent=credit.overview||credit.description||'Synopsis non communiqué dans la filmographie.';
 info.append(meta,label,synopsis);
 if(id){const lien=document.createElement('a');lien.textContent='Consulter la fiche complète sur TMDB';lien.href='https://www.themoviedb.org/'+type+'/'+encodeURIComponent(id)+'?language=fr-FR';lien.target='_blank';lien.rel='noopener noreferrer';lien.style.color='#ffe0a0';info.append(lien)}
 const proposal=document.createElement('button');proposal.type='button';proposal.textContent='Proposer '+(type==='tv'?'cette série':'ce film');proposal.style.cssText='display:block;margin-top:16px;background:#235941;color:#ffe6af;border:1px solid #d7b36d;border-radius:5px;padding:10px 14px;cursor:pointer;font:inherit';proposal.addEventListener('click',()=>window.cinemalandProposerFilmographie(titre,String(credit.date||credit.release_date||credit.first_air_date||'').slice(0,4),type==='tv'?'Série':'Film'));info.append(proposal);
 // Lien discret réservé à l'ajout direct par l'administration (même circuit que Films/Séries).
 const anneeAdmin=String(credit.date||credit.release_date||credit.first_air_date||'').slice(0,4);
 if(/^\d{4}$/.test(anneeAdmin)){
  const ajouterAdmin=document.createElement('a');
  ajouterAdmin.textContent='Ajouter à ma vidéothèque (administration)';
  ajouterAdmin.style.cssText='display:block;width:max-content;margin-top:10px;color:#d7b36d;text-decoration:underline;font-size:13px;background:transparent';
  ajouterAdmin.href=PERSON_API+'/?'+new URLSearchParams({title:titre,year:anneeAdmin,kind:type==='tv'?'Série':'Film'}).toString();
  ajouterAdmin.target='_blank';ajouterAdmin.rel='noopener noreferrer';
  info.append(ajouterAdmin);
 }
 row.append(info);d.append(retour,h,row);document.body.append(d);d.addEventListener('close',()=>d.remove());d.addEventListener('click',e=>{if(e.target===d)d.close()});d.showModal();
 if(id)fetch(PERSON_API+'/details?'+new URLSearchParams({type,id:String(id)})).then(r=>r.ok?r.json():null).then(data=>{if(!data||!d.isConnected)return;const details=data.details||data;const overview=details.overview||details.summary||details.description;if(overview)synopsis.textContent=overview}).catch(()=>{});
}

(function(){
