<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CINEMALAND — Cinéma mondial</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#060b19;color:white}
body{display:flex;justify-content:center;align-items:flex-start}
.hall-mondial{position:relative;width:min(100vw,1688px);aspect-ratio:1688/896;background:#060b19 url('hallmondial.png') center / 100% 100% no-repeat}
.retour{position:absolute;right:3%;top:68%;width:9%;height:10%;display:block;border:0;background:transparent;color:transparent;font-size:0;cursor:pointer}
.retour:hover,.retour:focus-visible{outline:2px solid #8acbff;outline-offset:-4px;box-shadow:0 0 18px #6cc9ff88;border-radius:12px}
.porte{position:absolute;display:block;z-index:5;background:transparent;color:transparent;font-size:0;text-decoration:none;cursor:pointer;border:0}
.porte:hover,.porte:focus-visible{outline:2px solid #8acbff;outline-offset:-4px;box-shadow:0 0 18px #6cc9ff88;border-radius:12px}
.porte-films{left:12%;top:39%;width:17%;height:36%}
.porte-series{left:71%;top:39%;width:17%;height:36%}
/* Quatre petits compteurs sur la façade basse du comptoir, sans toucher au PNG. */
.comptoir-compteurs{position:absolute;left:37.2%;top:79.2%;width:25.6%;height:7%;z-index:4;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0.5%;pointer-events:none;align-items:center}
.comptoir-compteur{min-width:0;text-align:center;padding:2px 1px;background:rgba(5,18,35,.83);border:1px solid #c79b48;border-radius:4px;color:#f6d79a;font:700 clamp(5px,.62vw,10px) Georgia,serif;letter-spacing:0;line-height:1.05}
.comptoir-compteur strong{display:block;margin-top:2px;color:#fff2c6;font:700 clamp(9px,1.15vw,19px) Georgia,serif;font-variant-numeric:tabular-nums}
@media(max-width:650px){.comptoir-compteur{border-width:0.5px;border-radius:2px;padding:1px 0}.comptoir-compteur strong{margin-top:1px}}

/* Animation lumineuse discrète du globe existant : PNG inchangé. */
.globe-animation{position:absolute;left:41.2%;top:0.4%;width:17.6%;height:26.2%;border-radius:50%;overflow:hidden;pointer-events:none;z-index:2;mask-image:radial-gradient(ellipse 49% 49% at 50% 50%,#000 75%,transparent 100%);-webkit-mask-image:radial-gradient(ellipse 49% 49% at 50% 50%,#000 75%,transparent 100%)}
.globe-animation::after{content:"";position:absolute;inset:-4% -50%;border-radius:50%;background:linear-gradient(90deg,transparent 15%,rgba(30,120,255,.06) 35%,rgba(190,245,255,.25) 49%,rgba(15,80,210,.04) 55%,transparent 76%);transform:translateX(-70%);animation:globe-passage 60s linear infinite;mix-blend-mode:screen}
@keyframes globe-passage{from{transform:translateX(-70%)}to{transform:translateX(70%)}}
@media(prefers-reduced-motion:reduce){.globe-animation::after{animation:none;opacity:0}}
/* Borne arcade cliquable ; décor PNG inchangé. */
.borne-arcade{position:absolute;left:67%;top:69%;width:8%;height:23%;z-index:6;display:block;color:transparent;font-size:0}
.borne-arcade:hover,.borne-arcade:focus-visible{outline:2px solid #8acbff;outline-offset:-3px;border-radius:7px}
.borne-arcade::after{content:"ARCADE — JOUER";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:max-content;max-width:170%;padding:5px 8px;border:1px solid #e7b75c;border-radius:5px;background:rgba(6,12,30,.94);color:#ffe0a0;font:700 clamp(8px,.8vw,13px) Georgia,serif;text-align:center;box-shadow:0 0 12px #65c9ff88;letter-spacing:.04em;white-space:nowrap;pointer-events:none}
.borne-arcade:hover::after,.borne-arcade:focus-visible::after{background:#17324b;color:#fff}
</style>
</head>
<body>
<main class="hall-mondial" aria-label="Hall du CINÉMA MONDIAL">
<div class="globe-animation" aria-hidden="true"></div>
<a class="porte porte-films" href="films-mondial.html" aria-label="Films du cinéma mondial" title="FILMS MONDIAUX">Films mondiaux</a>
<a class="porte porte-series" href="series-mondial.html" aria-label="Séries du cinéma mondial" title="SÉRIES MONDIALES">Séries mondiales</a>
<a class="borne-arcade" href="arcade.html" aria-label="Entrer dans la salle d’arcade" title="SALLE D’ARCADE">Salle d’arcade</a>
<section class="comptoir-compteurs" aria-label="Compteurs du cinéma mondial">
 <div class="comptoir-compteur">FILMS<strong id="cm-films">—</strong></div>
 <div class="comptoir-compteur">SÉRIES<strong id="cm-series">—</strong></div>
 <div class="comptoir-compteur">ACTEURS<strong id="cm-acteurs">—</strong></div>
 <div class="comptoir-compteur">RÉALISATEURS<strong id="cm-realisateurs">—</strong></div>
</section>
<a class="retour" href="index.html?hall=1" aria-label="Retour au hall du KURSAAL" title="RETOUR AU KURSAAL">Retour au KURSAAL</a>
</main>
<script src="catalogue.js"></script>
<script>
/* Compteurs de toute la vidéothèque, France comprise. */
(function(){
 const catalogue=window.CINEMALAND_CATALOGUE;
 if(!Array.isArray(catalogue))return;
 const films=new Set(),series=new Set(),acteurs=new Set(),realisateurs=new Set();
 const normalize=v=>String(v||'').trim().toLocaleLowerCase('fr');
 function addPeople(target,persons){
  for(const p of Array.isArray(persons)?persons:[]){
   const name=typeof p==='string'?p:p?.name;
   if(name&&normalize(name))target.add(normalize(name));
  }
 }
 for(const item of catalogue){
  if(!item||!item.title)continue;
  const kind=normalize(item.kind||item.type);
  const key=normalize(item.title)+'|'+String(item.year||'');
  if(kind==='série'||kind==='serie'||kind==='series'||kind==='tv')series.add(key);
  else if(kind==='film'||kind==='movie')films.add(key);
  addPeople(acteurs,item.cast||item.actors);
  addPeople(realisateurs,item.directors);
  addPeople(realisateurs,item.creators);
 }
 for(const [id,value] of [['cm-films',films.size],['cm-series',series.size],['cm-acteurs',acteurs.size],['cm-realisateurs',realisateurs.size]]){
  document.getElementById(id).textContent=value.toLocaleString('fr-FR');
 }
})();
</script>
</body>
</html>
