<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CINEMALAND — À VOIR</title><style>
body{margin:0;background:radial-gradient(ellipse at top,#53151c,#14090c 52%,#07080b);color:#f6e8cf;font:18px Georgia,serif}header{text-align:center;padding:35px;border-bottom:3px double #e8b85b}h1,h2{color:#f5cc7b}nav{text-align:center;padding:18px;background:#180609}a{color:#f5cc7b;margin:0 12px}main{max-width:950px;margin:24px auto;padding:20px}.item{background:#17090e;border:2px solid #c79b4a;border-radius:8px;margin:14px 0;padding:18px;display:flex;gap:20px}.item img{width:105px;height:155px;object-fit:contain}.meta{color:#e8b85b}p{white-space:pre-wrap;line-height:1.5}@media(max-width:600px){.item img{width:75px;height:110px}}
</style></head><body><header><h1>🍿 CINEMALAND — À VOIR</h1><p>Les films et séries repérés par Michel et Christiane</p></header><nav><a href="index.html">ACCUEIL</a><a href="films.html">FILMS</a><a href="series.html">SÉRIES</a></nav><main><p id="status">Chargement de notre liste…</p><div id="list"></div></main><script src="catalogue.js"></script><script>
const API='https://videotheque-admin.michelmalandain.workers.dev/reviews';const norm=x=>String(x||'').normalize('NFC').toLocaleLowerCase('fr');
async function update(){try{const r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();const list=document.getElementById('list');list.replaceChildren();let count=0;
for(const x of (window.CINEMALAND_CATALOGUE||[])){const k=x.kind+'|'+x.year+'|'+norm(x.title);const v=(d.reviews||{})[k];if(!v?.watch)continue;count++;const item=document.createElement('article');item.className='item';const img=document.createElement('img');img.src=x.poster||'';img.alt='Affiche de '+x.title;img.onerror=()=>img.remove();const box=document.createElement('div');const h=document.createElement('h2');h.textContent=x.title;const m=document.createElement('div');m.className='meta';m.textContent=x.kind+' · '+x.year+(v.stars?' · '+'★'.repeat(v.stars)+'☆'.repeat(5-v.stars):'');const p=document.createElement('p');p.textContent=v.comment||'';box.append(h,m,p);item.append(img,box);list.append(item);}
document.getElementById('status').textContent=count?count+' titre(s) à voir.':'Aucun titre coché « À voir » pour le moment.';
}catch{document.getElementById('status').textContent='Liste temporairement indisponible.';}}
update();setInterval(update,30000);
</script></body></html>
