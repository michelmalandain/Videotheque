<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CINEMALAND — À VOIR</title><style>
body{margin:0;background:radial-gradient(ellipse at top,#53151c,#14090c 52%,#07080b);color:#f6e8cf;font:18px Georgia,serif}header{text-align:center;padding:35px;border-bottom:3px double #e8b85b}h1,h2{color:#f5cc7b}nav{text-align:center;padding:18px;background:#180609}a{color:#f5cc7b;margin:0 12px}.print-actions{text-align:center;margin:18px 0}.print-actions button{background:#e8b85b;color:#180609;border:0;border-radius:6px;padding:11px 22px;font:700 17px Georgia,serif;cursor:pointer}.print-actions button:disabled{opacity:.5;cursor:not-allowed}@page{size:A4 portrait;margin:12mm}@media print{body{background:white!important;color:black!important;font:10pt Arial,sans-serif}header{padding:0 0 8mm;border:0;text-align:center}header h1{color:black!important;font-size:17pt;margin:0}header p{margin:3mm 0 0;color:#333;font-size:10pt}nav,.print-actions{display:none!important}main{max-width:none;margin:0;padding:0}#status{font-weight:bold;margin:0 0 5mm}#list{display:block}.item{display:block!important;background:white!important;color:black!important;border:0!important;border-bottom:1px solid #bbb!important;border-radius:0!important;padding:2.5mm 0!important;margin:0!important;break-inside:avoid;page-break-inside:avoid}.item img,.item p{display:none!important}.print-details{display:block!important;font-size:10.5pt;line-height:1.35;text-align:justify;margin-top:1.5mm}.print-details p{display:block!important;white-space:normal;margin:1mm 0}.print-details strong{font-weight:700}.item h2{display:inline!important;color:black!important;font-size:11pt!important;font-weight:700;margin:0 3mm 0 0}.item .meta{display:inline!important;color:#333!important;font-size:10pt}.item .meta::before{content:"— "}}.print-details{display:none}main{max-width:950px;margin:24px auto;padding:20px}.item{background:#17090e;border:2px solid #c79b4a;border-radius:8px;margin:14px 0;padding:18px;display:flex;gap:20px}.item img{width:105px;height:155px;object-fit:contain}.meta{color:#e8b85b}p{white-space:pre-wrap;line-height:1.5}@media(max-width:600px){.item img{width:75px;height:110px}}
</style></head><body><header><h1>🍿 CINEMALAND — À VOIR</h1><p>Les films et séries repérés par Michel et Christiane</p></header><nav><a href="index.html">ACCUEIL</a><a href="films.html">FILMS</a><a href="series.html">SÉRIES</a></nav><main><div class="print-actions"><button type="button" id="print-button" onclick="window.print()" disabled>🖨 Imprimer la liste</button></div><p id="status">Chargement de notre liste…</p><div id="list"></div></main><script src="catalogue.js"></script><script>
const API='https://videotheque-admin.michelmalandain.workers.dev/reviews';const norm=x=>String(x||'').normalize('NFC').toLocaleLowerCase('fr');
async function update(){try{const r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();const list=document.getElementById('list');list.replaceChildren();let count=0;
for(const x of (window.CINEMALAND_CATALOGUE||[])){const k=x.kind+'|'+x.year+'|'+norm(x.title);const v=(d.reviews||{})[k];if(!v?.watch)continue;count++;const item=document.createElement('article');item.className='item';const img=document.createElement('img');img.src=x.poster||'';img.alt='Affiche de '+x.title;img.onerror=()=>img.remove();const box=document.createElement('div');const h=document.createElement('h2');h.textContent=x.title;const m=document.createElement('div');m.className='meta';m.textContent=x.kind+' · '+x.year+(v.stars?' · '+'★'.repeat(v.stars)+'☆'.repeat(5-v.stars):'');const p=document.createElement('p');p.textContent=v.comment||'';box.append(h,m,p);
const details=document.createElement('div');details.className='print-details';
function addDetail(label,value){if(!value)return;const line=document.createElement('p');const bold=document.createElement('strong');bold.textContent=label+' : ';line.append(bold,document.createTextNode(value));details.append(line);}
const directors=Array.isArray(x.directors)?x.directors.filter(Boolean).join(', '):'';
const actors=Array.isArray(x.cast)?x.cast.slice(0,5).map(a=>typeof a==='string'?a:a?.name).filter(Boolean).join(', '):'';
const synopsis=x.summary||(x.description&&x.description!=='Description à compléter.'?x.description:'');
addDetail('Réalisation',directors);addDetail('Acteurs',actors);addDetail('Synopsis',synopsis);
if(v.comment)addDetail('Notre avis',v.comment);
if(!synopsis)addDetail('Synopsis','Non renseigné dans le catalogue.');
box.append(details);item.append(img,box);list.append(item);}
document.getElementById('status').textContent=count?count+' titre(s) à voir.':'Aucun titre coché « À voir » pour le moment.';document.getElementById('print-button').disabled=!count;
}catch{document.getElementById('status').textContent='Liste temporairement indisponible.';document.getElementById('print-button').disabled=true;}}
update();setInterval(update,30000);
</script></body></html>
