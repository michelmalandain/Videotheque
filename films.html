    layout.append(img,contenu); main.append(layout);
    const actions=doc.createElement('div');actions.className='actions';
    const fermer=doc.createElement('button');fermer.type='button';fermer.textContent='Fermer la fiche';
    fermer.onclick=()=>onglet.close();
    const retour=doc.createElement('a');retour.textContent='🎬 Retour à la vidéothèque';retour.href=location.href;
    actions.append(fermer,retour);main.append(actions);
    doc.body.append(entete,main);
  }

  // Fiche intégrée pour toutes les œuvres de la filmographie, y compris hors collection.
  function ficheTMDB(ligne, image) {
    const credit=JSON.parse(decodeURIComponent(ligne.dataset.credit||'%7B%7D'));
    const titre=credit.title||ligne.querySelector('strong')?.textContent||'Film';
    const id=ligne.dataset.tmdbId;
    const type=ligne.dataset.mediaType==='tv'?'tv':'movie';
    const lien=id?'https://www.themoviedb.org/'+type+'/'+encodeURIComponent(id)+'?language=fr-FR':'https://www.themoviedb.org/search?query='+encodeURIComponent(titre);
    const d=document.createElement('dialog');d.className='film-dialog';
    d.style.cssText='max-width:min(850px,94vw);width:850px;max-height:90vh;overflow:auto;background:#160d11;color:#f6e8cf;border:3px double #e8b85b;border-radius:10px;padding:24px';
    const close=document.createElement('button');close.textContent='Retour à la filmographie';close.className='close';close.type='button';close.addEventListener('click',()=>d.close());
    const h=document.createElement('h2');h.textContent=titre;h.style.color='#f5cc7b';
    const grid=document.createElement('div');grid.style.cssText='display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start';
    const poster=document.createElement('img');poster.src=image.src.replace('/w154','/w500');poster.alt='Affiche de '+titre;poster.style.cssText='width:min(220px,100%);max-height:340px;object-fit:contain;border:2px solid #e8b85b';
    const info=document.createElement('div');info.style.cssText='flex:1;min-width:220px;line-height:1.6';
    const meta=document.createElement('p');meta.textContent=(credit.date||'').slice(0,4)+' · '+(type==='tv'?'Série':'Film')+(credit.job?' · '+credit.job:'');
    const label=document.createElement('h3');label.textContent='Synopsis';label.style.color='#f5cc7b';
    const overview=document.createElement('p');overview.textContent=credit.overview||credit.description||'Synopsis non communiqué dans la filmographie.';
    const source=document.createElement('a');source.href=lien;source.target='_blank';source.rel='noopener noreferrer';source.textContent='🎬 Consulter la fiche complète sur TMDB ↗';source.style.color='#f5cc7b';
    // Bouton d'ajout : transmet les données exactes de la fiche TMDB à l'administration.
    const annee=(credit.date||'').slice(0,4);
    const ajouter=document.createElement('a');
    ajouter.textContent='➕ Ajouter à ma vidéothèque';
    ajouter.style.cssText='display:inline-block;margin-top:18px;padding:12px 16px;background:#7e101a;color:#ffe2a0;border:2px solid #e8b85b;border-radius:6px;text-decoration:none;font-weight:bold';
    const params=new URLSearchParams({title:titre,year:annee,kind:type==='tv'?'Série':'Film'});
    ajouter.href='https://videotheque-admin.michelmalandain.workers.dev/?'+params.toString();
    ajouter.target='_blank';ajouter.rel='noopener noreferrer';
    if(!/^\d{4}$/.test(annee)){ajouter.style.display='none';}
    // Vérification du catalogue local avant toute proposition d'ajout.
    const normaliser=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
    const present=catalogue.find(x=>normaliser(x.title)===normaliser(titre)
      && String(x.year)===annee && (x.kind==='Série'?'tv':'movie')===type);
    if(present){
      ajouter.textContent='Déjà dans ma vidéothèque';
      ajouter.removeAttribute('href');ajouter.removeAttribute('target');
      ajouter.setAttribute('aria-disabled','true');
      ajouter.style.cssText='display:inline-block;margin-top:18px;padding:12px 16px;background:#555;color:#ddd;border:2px solid #999;border-radius:6px;text-decoration:none;font-weight:bold;cursor:not-allowed;pointer-events:none';
      poster.style.cursor='pointer';poster.title='Ouvrir la fiche dans CINEMALAND';
      poster.tabIndex=0;poster.setAttribute('role','button');
      const ouvrirCatalogue=()=>{window.location.href=(type==='tv'?'series.html':'films.html')+'?fiche='+encodeURIComponent(present.title)+'&annee='+encodeURIComponent(annee)};
      poster.addEventListener('click',ouvrirCatalogue);
      poster.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();ouvrirCatalogue()}});
    }

    info.append(meta,label,overview,source,ajouter);grid.append(poster,info);d.append(close,h,grid);
    document.body.append(d);d.addEventListener('close',()=>d.remove());d.addEventListener('click',e=>{if(e.target===d)d.close()});d.showModal();
    // Complète la fiche si le Worker propose déjà une route de détails.
    if(id)fetch('https://videotheque-admin.michelmalandain.workers.dev/details?type='+type+'&id='+encodeURIComponent(id))
      .then(r=>{if(!r.ok)throw Error('non disponible');return r.json()})
      .then(data=>{const detail=data.details||data;const synopsis=detail.overview||detail.summary||detail.description;if(synopsis)overview.textContent=synopsis;
        const genres=Array.isArray(detail.genres)?detail.genres.map(g=>g.name||g).join(', '):'';
        if(genres){const p=document.createElement('p');p.textContent='Genres : '+genres;info.insertBefore(p,label)}
      }).catch(()=>{});
  }
  liste.addEventListener('click', function (evenement) {
    const img=evenement.target.closest('.person-film img');
    if(!img||!liste.contains(img))return;
    evenement.preventDefault();evenement.stopPropagation();
    const ligne=img.closest('.person-film');
    // Priorité aux données TMDB de l'œuvre exacte : pas de confusion entre homonymes.
    ficheTMDB(ligne,img);
  },true);
  const style=document.createElement('style');
  style.textContent='#person-films .person-film img{cursor:pointer;transition:transform .2s}#person-films .person-film img:hover{transform:scale(1.06);outline:2px solid #f5cc7b}';
  document.head.append(style);
})();
<script>
// Ouvre la fiche d'une œuvre présente dans notre catalogue après navigation.
(function(){
 const params=new URLSearchParams(location.search),titre=params.get('fiche'),annee=params.get('annee');
 if(!titre)return;
 const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
 const x=catalogue.find(f=>norm(f.title)===norm(titre)&&(!annee||String(f.year)===annee));
 if(!x)return;
 const search=document.getElementById('search');search.value=x.title;search.dispatchEvent(new Event('input'));
 setTimeout(()=>{if(typeof openFilm==='function')openFilm(x)},100);
})();
</script></body></html>
