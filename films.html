ound:#1b1215;border:1px solid #bd9353;color:#f6e8cf;cursor:pointer;border-radius:6px}.person-film:hover{background:#42202a}.person-film img{width:62px;height:85px;object-fit:contain}.person-film strong,.person-film small{display:block}.person-film strong{font-size:19px;color:#f5cc7b}.person-film small{margin-top:7px}.person-note{font-size:13px;color:#d9bb87}</style><script>document.write('<script src="catalogue.js?fresh='+Date.now()+'"><\/script>');</script><script>
/* CINEMALAND : vérification discrète du catalogue toutes les 20 secondes. */
(function(){
 const initial=JSON.stringify(window.CINEMALAND_CATALOGUE || []);
 let checking=false;
 async function checkCatalogue(){
  if(checking || document.hidden) return;
  checking=true;
  try{
   const r=await fetch('catalogue.js?actualisation='+Date.now(),{cache:'no-store'});
   if(!r.ok)return;
   const source=await r.text();
   const m=source.match(/window\.CINEMALAND_CATALOGUE\s*=\s*(\[[\s\S]*\])\s*;/);
   if(!m)return;
   const current=JSON.stringify(JSON.parse(m[1]));
   if(current!==initial) location.reload();
  }catch(e){/* réseau momentanément indisponible */}
  finally{checking=false;}
 }
 setInterval(checkCatalogue,20000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkCatalogue();});
})();

<script id="cinemaland-trois-colonnes-js">
(function(){
 const dlg=document.getElementById('person-dialog'),list=document.getElementById('person-films');
 const hero=document.createElement('div');hero.className='cm-hero';
 const nav=document.createElement('div');nav.className='cm-dialog-nav';
 for(const [label,dest] of [['Accueil','index.html'],['Films','films.html'],['Séries','series.html']]){
  const b=document.createElement('button');b.type='button';b.textContent=label;
  b.addEventListener('click',()=>{document.querySelectorAll('dialog[open]').forEach(d=>d.close());window.location.href=dest});nav.append(b);
 }
 const closeBtn=document.createElement('button');closeBtn.type='button';closeBtn.textContent='Fermer';closeBtn.className='cm-close';closeBtn.addEventListener('click',()=>dlg.close());nav.append(closeBtn);
 dlg.insertBefore(nav,dlg.firstChild);
 const columns=document.createElement('div');columns.className='cm-columns';
 const panel=(title)=>{const p=document.createElement('section');p.className='cm-panel';const h=document.createElement('h3');h.textContent=title;p.append(h);columns.append(p);return p};
 const bio=panel('Biographie'),bioText=document.createElement('div');bioText.className='cm-scroll';bio.append(bioText);
 const film=panel('Filmographie'),tabs=document.createElement('div');tabs.className='cm-tabs';film.append(tabs,list);
 
 dlg.insertBefore(hero,dlg.firstChild);dlg.append(columns);
 let credits=[],generation=0,filter='all';
 const api='https://videotheque-admin.michelmalandain.workers.dev';
 const imgUrl=(path,size='w342')=>path&&String(path).startsWith('/')?'https://image.tmdb.org/t/p/'+size+path:null;
 const p=(parent,text)=>{const node=document.createElement('p');node.textContent=text;parent.append(node);return node};
 function draw(){
  list.replaceChildren();
  const shown=credits.filter(c=>filter==='all'||(filter==='tv')===(c.media_type==='tv'));
  shown.sort((a,b)=>String(a.title||a.name||'').localeCompare(String(b.title||b.name||''),'fr',{sensitivity:'base',ignorePunctuation:true}));
  for(const x of shown){
   const row=document.createElement('button');row.className='person-film';row.type='button';
   row.dataset.tmdbId=x.id||'';row.dataset.mediaType=x.media_type==='tv'?'tv':'movie';row.dataset.credit=encodeURIComponent(JSON.stringify(x));
   const url=imgUrl(x.poster_path,'w154');if(url){const im=document.createElement('img');im.src=url;im.loading='lazy';im.alt='';row.append(im)}
   const box=document.createElement('span'),strong=document.createElement('strong'),small=document.createElement('small');
   strong.textContent=x.title||x.name||'Sans titre';small.textContent=[String(x.date||'').slice(0,4),x.media_type==='tv'?'Série':'Film',x.character||x.job].filter(Boolean).join(' · ');
   box.append(strong,small);row.append(box);list.append(row);
  }
 }
 function buttons(){tabs.replaceChildren();for(const [value,label] of [['all','Tous'],['movie','Films'],['tv','Séries']]){const b=document.createElement('button');b.textContent=label+' ('+credits.filter(x=>value==='all'||(value==='tv')===(x.media_type==='tv')).length+')';b.setAttribute('aria-pressed',String(filter===value));b.onclick=()=>{filter=value;buttons();draw()};tabs.append(b)}}
 window.showPerson=async function(person,source,role){const ticket=++generation;const name=personName(person);document.querySelectorAll('dialog[open]').forEach(d=>{if(d!==dlg)d.close()});
 const title=document.getElementById('person-title');title.textContent=name;hero.replaceChildren();const head=document.createElement('div');
 bioText.textContent='Chargement de la biographie…';credits=[];filter='all';buttons();draw();if(!dlg.open)dlg.showModal();
 const id=typeof person==='object'?(person.tmdb_id||person.id):null;const params=new URLSearchParams({role:role||'all',name});if(id)params.set('id',id);else if(source){params.set('title',source.title);params.set('year',source.year);params.set('type',source.kind==='Série'?'tv':'movie')}
 // Utiliser en priorité l’identifiant de la personne, jamais celui d’un film.
 // La réponse filmography peut aussi contenir l’identifiant résolu par le Worker.
 const filmResult=await Promise.allSettled([fetch(api+'/filmography?'+params).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.message||'Filmographie indisponible');return d})]);
 const filmData=filmResult[0].status==='fulfilled'?filmResult[0].value:null;
 const normalizeName=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
 async function loadPersonDetail(){
  let personId=id;
  if(!personId && filmData){
   const candidate=filmData.person||filmData.person_detail||filmData.personData;
   if(candidate && normalizeName(candidate.name)===normalizeName(name))personId=candidate.tmdb_id||candidate.id;
   if(!personId && filmData.person_id && (!filmData.name||normalizeName(filmData.name)===normalizeName(name)))personId=filmData.person_id;
  }
  if(!personId && source){
   const persons=[...(source.cast||[]),...(source.directors||[])];
   const matches=persons.filter(x=>x&&typeof x==='object'&&normalizeName(x.name)===normalizeName(name)&& (x.tmdb_id||x.id));
   const ids=[...new Set(matches.map(x=>x.tmdb_id||x.id))];
   if(ids.length===1)personId=ids[0];
  }
  if(!personId){
   const parts=name.trim().split(/\s+/);
   if(parts.length>=2){
    const last=parts.pop(),first=parts.join(' ');
    const search=await fetch(api+'/person-search?'+new URLSearchParams({first,last}));
    if(search.ok){
     const found=await search.json();
     const exact=(found.people||[]).filter(x=>normalizeName(x.name)===normalizeName(name));
     const ids=[...new Set(exact.map(x=>x.tmdb_id||x.id).filter(Boolean))];
     if(ids.length===1)personId=ids[0];
    }
   }
  }
  if(!personId)return null;
  const response=await fetch(api+'/person-detail?id='+encodeURIComponent(personId));
  if(!response.ok)throw Error('Biographie indisponible');
  const data=await response.json();
  if(data.name && normalizeName(data.name)!==normalizeName(name))return null;
  return data;
 }
 const results=[filmResult[0],await Promise.allSettled([loadPersonDetail()]).then(r=>r[0])];
 if(ticket!==generation||!dlg.open)return;
 if(results[0].status==='fulfilled'&&Array.isArray(results[0].value.credits)){credits=results[0].value.credits;buttons();draw();if(!credits.length)list.textContent='Aucun titre disponible.'}else{list.textContent=results[0].reason?.message||'Filmographie indisponible'}
 bioText.replaceChildren();const nameHeading=document.createElement('h2');nameHeading.className='cm-person-name';nameHeading.textContent=name;bioText.append(nameHeading);const personData=results[1].status==='fulfilled'?results[1].value:null;
 if(personData){const portrait=imgUrl(personData.profile_path);if(portrait){const im=document.createElement('img');im.src=portrait;im.alt='Portrait de '+name;const second=im.cloneNode();second.className='cm-portrait';bioText.append(second)}
 p(head,[personData.known_for_department==='Directing'?'Réalisation':'Interprétation',personData.birthday?'Né(e) le '+personData.birthday:'',personData.place_of_birth].filter(Boolean).join(' · '));p(bioText,personData.biography||'Biographie non disponible sur TMDB.');}
 else p(bioText,'Biographie indisponible pour cette recherche.');
 };
 dlg.addEventListener('close',()=>{generation++});
})();
</script>
