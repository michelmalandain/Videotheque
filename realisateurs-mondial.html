<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CINÉMA MONDIAL — RÉALISATEURS</title><style>
:root{--gold:#e6c27a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#18563b,#071e17 57%,#04110d);color:#f5e6c5;font:17px Georgia,serif;min-height:100vh}header{text-align:center;padding:28px 15px 22px;background:linear-gradient(125deg,#123f31,#09241c);border-bottom:1px solid #caa76c}header h1{font-size:clamp(30px,4.4vw,55px);letter-spacing:.09em;margin:0;color:#f8e5b9}header p{font-size:19px;letter-spacing:.11em;margin:7px 0 0;color:#cce8d6}nav{position:sticky;top:0;z-index:10;background:#071e19f5;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:13px;border-bottom:1px solid #bd9c62}nav a{display:inline-block;padding:11px 16px;border:1px solid #baaa80;border-radius:6px;background:linear-gradient(#20523f,#103326);color:#f9e4b7;text-decoration:none;font-weight:bold;text-align:center}nav a[aria-current=page],nav a:hover{background:#397356;color:white}main{width:min(1460px,96%);margin:24px auto}.controls{display:flex;gap:15px;align-items:center;margin-bottom:22px}.controls input{flex:1;min-width:0;background:#f5e8ce;border:2px solid #d8b678;border-radius:5px;padding:13px;font:inherit;color:#14271e}#count{white-space:nowrap;color:#f2d49b;font-weight:bold}#status{color:#f2d49b}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(9px,1.2vw,19px)}.card{min-width:0;position:relative;display:flex;flex-direction:column;align-items:stretch;gap:8px;border:2px solid #d9b36d;border-radius:15px;background:linear-gradient(140deg,#176147 0%,#0b3228 43%,#071c17 100%);color:#f9e7c5;padding:12px;cursor:pointer;text-align:center;font:inherit;box-shadow:0 7px 18px #0008;overflow:hidden;transition:transform .15s,box-shadow .15s}.card::before{content:'CINEMALAND  ·  CARTE MEMBRE';color:#e8cf96;font-size:clamp(8px,.76vw,12px);font-weight:bold;letter-spacing:.025em;line-height:1.5;text-align:right;padding-left:35px;min-height:27px;display:flex;align-items:center;justify-content:flex-end}.card::after{content:'';position:absolute;top:13px;left:12px;width:29px;height:22px;border-radius:5px;border:1px solid #f6db9b;background:linear-gradient(90deg,transparent 45%,#ad873c 46%,#ad873c 51%,transparent 52%),linear-gradient(0deg,transparent 45%,#ad873c 46%,#ad873c 51%,transparent 52%),linear-gradient(135deg,#fff1b2,#c69838 65%,#f4d98a);box-shadow:0 1px 3px #0007}.portrait-tmdb{width:100%;aspect-ratio:3/4;overflow:hidden;background:#0b241e;display:flex;align-items:center;justify-content:center;border:1px solid #b69a5f}.portrait-tmdb img{display:block;width:100%;height:100%;object-fit:cover;margin:0;float:none}.portrait-tmdb.sans-photo:after{content:'PHOTO INDISPONIBLE';font-size:12px;color:#d9c4a3}.card strong{color:#ffe0a0;font-size:clamp(13px,1.1vw,18px);line-height:1.25;min-height:2.4em;display:flex;align-items:center;justify-content:center}.card small{color:#d4dfcc;font-size:clamp(10px,.82vw,13px);line-height:1.3}.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 0 0 2px #e6c27a,0 10px 25px #000b;outline:0}@media(max-width:1000px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:650px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.controls{flex-wrap:wrap}#count{width:100%}nav a{font-size:13px;padding:9px 11px}}</style><style id="mondial-tapis-style">
.mondial-tapis{position:relative;overflow:hidden;background:linear-gradient(100deg,#061c16,#15523b 50%,#061c16);border-top:2px solid #c9a669;border-bottom:2px solid #c9a669;padding:10px 0;min-height:140px}.mondial-tapis-track{display:flex;align-items:center;gap:12px;width:max-content;animation:mondial-roule 95s linear infinite}.mondial-tapis:hover .mondial-tapis-track,.mondial-tapis:focus-within .mondial-tapis-track{animation-play-state:paused}.mondial-tapis-item{flex:0 0 auto;width:82px;height:118px;border:1px solid #c9a669;border-radius:3px;overflow:hidden;display:block;background:#09271f;box-shadow:0 2px 8px #0008}.mondial-tapis-item img{width:100%;height:100%;object-fit:cover;display:block}.mondial-tapis-item:focus-visible{outline:3px solid #fff0b9;outline-offset:2px}@keyframes mondial-roule{from{transform:translateX(0)}to{transform:translateX(-50%)}}@media(prefers-reduced-motion:reduce){.mondial-tapis-track{animation:none;max-width:100vw;overflow-x:auto}}@media(max-width:600px){.mondial-tapis-item{width:62px;height:92px}.mondial-tapis{min-height:110px}}
</style><style id="fiche-acteur-mondial">
.actor-dialog{width:min(1200px,96vw);max-height:94vh;overflow:auto;border:2px solid #d7b36d;border-radius:12px;background:linear-gradient(140deg,#164c39,#071e17);color:#f5e6c5;padding:25px;box-shadow:0 20px 80px #000c}.actor-dialog::backdrop{background:#000c}.actor-close{float:right;padding:10px 20px;background:#235941;color:#ffe6af;border:1px solid #d7b36d;border-radius:5px;cursor:pointer;font:inherit}.actor-profile{display:grid;grid-template-columns:230px 1fr;gap:25px;align-items:start;clear:both;padding-top:15px}.actor-profile img{width:100%;max-height:330px;object-fit:cover;border:2px solid #d7b36d}.actor-profile h2{font-size:32px;color:#ffe0a0;margin:0 0 16px}.actor-section{margin-top:24px}.actor-section h3{color:#f9d38c;border-bottom:1px solid #b99459;padding-bottom:9px}.actor-tickets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.actor-ticket{display:grid;grid-template-columns:54px 1fr 52px;gap:8px;align-items:center;min-height:83px;padding:8px;border:2px solid #b99558;border-radius:6px;background:linear-gradient(125deg,#25674b,#103829);color:#ffe9bf;text-align:left;font:inherit}.actor-ticket-year{color:#f4cc81;font-weight:bold}.actor-ticket img{width:50px;height:68px;object-fit:cover}.actor-ticket strong{overflow-wrap:anywhere;font-size:15px}.actor-ticket.present{outline:2px solid #e8c17b}.actor-ticket small{grid-column:2 / 4;color:#d9e5d6;font-size:11px}@media(max-width:850px){.actor-tickets{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.actor-profile{grid-template-columns:1fr}.actor-profile img{max-width:210px}.actor-tickets{grid-template-columns:1fr}}
 .bio-link{color:#ffe0a0;text-decoration:underline;text-underline-offset:3px}.bio-link:hover{color:white}
.actor-section.bio-readable{max-width:100%;}.bio-readable p{font-size:18px;line-height:1.75;margin:0 0 1.15em;max-width:100%;font-weight:normal}.bio-readable h3{margin-bottom:18px}
</style></head><body><header><h1>CINÉMA MONDIAL</h1><p>RÉALISATEURS DU MONDE ENTIER</p></header><div class="mondial-tapis" aria-label="Affiches de la vidéothèque en défilement"><div class="mondial-tapis-track" id="mondial-tapis-track"></div></div><nav><a href="hallmondial.html">HALL MONDIAL</a><a href="films-mondial.html">FILMS MONDIAUX</a><a href="series-mondial.html">SÉRIES MONDIALES</a><a href="acteurs-mondial.html">ACTEURS</a><a href="realisateurs-mondial.html" aria-current="page">RÉALISATEURS</a></nav><main><div class="controls"><input id="filter" placeholder="Filtrer la liste par nom" aria-label="Filtrer par nom"><span id="count"></span></div><p id="status">Chargement du catalogue…</p><div id="cards" class="cards"></div></main><dialog id="actor-detail" class="actor-dialog"><button type="button" class="actor-close" id="actor-close">RETOUR</button><div id="actor-content"></div></dialog><script src="catalogue.js"></script>
<script>
const ROLE='director', all=window.CINEMALAND_CATALOGUE;
const cards=document.getElementById('cards'), status=document.getElementById('status'), counter=document.getElementById('count');
const entries=new Map();
function add(person,film){
 const name=typeof person==='string'?person:(person?.name||'');
 if(!name.trim())return;
 const key=name.trim().toLocaleLowerCase('fr');
 let row=entries.get(key);
 if(!row){row={name:name.trim(),id:null,photo:null,films:new Set()};entries.set(key,row)}
 if(person && typeof person==='object'){
  row.id ||=person.tmdb_id||person.id||null;
  row.photo ||=person.profile_path||person.photo||null;
 }
 row.films.add([film.kind||film.type||'',film.title||'',film.year||''].join('|'));
}
if(Array.isArray(all)){
 for(const f of all){
  const film=f||{};
  if(ROLE==='actor'){for(const p of (film.cast||film.actors||[]))add(p,film);}
  else {for(const p of [...(film.directors||[]),...(film.creators||[])])add(p,film);}
 }
}
const people=[...entries.values()].sort((a,b)=>a.name.localeCompare(b.name,'fr',{sensitivity:'base'}));
function draw(){
 const term=document.getElementById('filter').value.trim().toLocaleLowerCase('fr');
 cards.replaceChildren();
 const matching=people.filter(x=>x.name.toLocaleLowerCase('fr').includes(term));
 counter.textContent=matching.length+' réalisateurs';
 for(const person of matching){
  const b=document.createElement('button');b.type='button';b.className='card';
  const name=document.createElement('strong');name.textContent=person.name;
  const sub=document.createElement('small');sub.textContent=person.films.size+' titre(s) dans notre vidéothèque';
  const photo=document.createElement('div');photo.className='portrait-tmdb';
  const img=document.createElement('img');img.alt='Portrait de '+person.name;img.loading='lazy';
  img.onerror=()=>{img.style.display='none';photo.classList.add('sans-photo')};
  photo.append(img);b.append(photo);
  if(person.photo)img.src=person.photo.startsWith('http')?person.photo:'https://image.tmdb.org/t/p/w185'+person.photo;
  else {img.style.display='none';photo.classList.add('sans-photo');}
  person.node=img;person.photoBox=photo;
  b.append(name,sub);
  b.onclick=()=>openActorDetail(person);
  cards.append(b);
 }
}
document.getElementById('filter').addEventListener('input',draw);
status.textContent=Array.isArray(all)?(people.length?'':'Aucune personne trouvée dans les crédits du catalogue.'):'Catalogue indisponible : placer catalogue.js avec ces pages.';
draw();
// Compléter les photos manquantes depuis le service TMDB déjà utilisé par CINEMALAND.
// L'identifiant TMDB prime toujours sur les homonymes ; ne jamais attribuer
// une photographie à une personne si le nom exact est ambigu.
const PERSON_API='https://videotheque-admin.michelmalandain.workers.dev';
const normalized=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('fr').trim();
function setPhoto(person,profile){
 if(!profile||!person.node)return;
 const path=String(profile);
 person.node.src=path.startsWith('http')?path:'https://image.tmdb.org/t/p/w185'+(path.startsWith('/')?path:'/'+path);
 person.node.style.display='block';person.photoBox?.classList.remove('sans-photo');
}
async function resolvePortrait(person){
 if(person.photo||!person.node)return;
 const parts=person.name.trim().split(/\s+/);if(parts.length<2)return;
 const last=parts.pop(),first=parts.join(' ');
 try{
  const response=await fetch(PERSON_API+'/person-search?'+new URLSearchParams({first,last}));
  if(!response.ok)return;
  const data=await response.json();
  const exact=(data.people||[]).filter(p=>normalized(p.name)===normalized(person.name));
  const match=person.id?exact.find(p=>String(p.id)===String(person.id)):(exact.length===1?exact[0]:null);
  if(!match)return;
  if(match.id&&!person.id)person.id=match.id;
  setPhoto(person,match.profile_path||match.photo||match.profile);
  // Le détail de la personne est demandé seulement si la recherche ne fournit pas de portrait.
  if(!person.node.src||person.node.style.display==='none'){
   const detail=await fetch(PERSON_API+'/person-detail?id='+encodeURIComponent(match.id));
   if(detail.ok){const d=await detail.json();setPhoto(person,(d.person||d.details||d).profile_path)}
  }
 }catch(e){/* Ne jamais empêcher l'affichage des tickets si le service est indisponible. */}
}
async function loadPortraits(){
 const queue=people.filter(p=>!p.photo);
 // 3 requêtes simultanées maximum, pour ménager le service et le navigateur.
 let i=0;await Promise.all(Array.from({length:Math.min(3,queue.length)},async()=>{
  while(i<queue.length){const p=queue[i++];await resolvePortrait(p)}
 }));
}

const actorDialog=document.getElementById('actor-detail');
const actorContent=document.getElementById('actor-content');
// Retour à la liste et à son filtre, sans quitter la page mondiale.
document.getElementById('actor-close').onclick=()=>actorDialog.close();
// Compléments Wikidata : correspondance exacte par identifiant TMDB (P4985).
// Aucune nationalité n'est déduite du lieu de naissance.
const BIO_WIKIDATA_PROPS={P27:'Nationalité',P26:'Conjoint(e)',P40:'Enfants',P22:'Père',P25:'Mère',P69:'Formation',P856:'Site officiel',P106:'Profession'};
const BIO_NATIONALITES={'Q142':'Française','Q183':'Allemande','Q38':'Italienne','Q29':'Espagnole','Q31':'Belge','Q39':'Suisse','Q16':'Canadienne','Q30':'Américaine','Q145':'Britannique','Q17':'Japonaise','Q148':'Chinoise','Q155':'Brésilienne','Q159':'Russe','Q96':'Mexicaine','Q408':'Australienne','Q55':'Néerlandaise','Q20':'Norvégienne','Q34':'Suédoise','Q35':'Danoise','Q33':'Finlandaise','Q36':'Polonaise','Q45':'Portugaise','Q41':'Grecque','Q43':'Turque','Q262':'Algérienne','Q1041':'Sénégalaise','Q1028':'Marocaine','Q948':'Tunisienne','Q79':'Égyptienne','Q668':'Indienne','Q884':'Sud-coréenne','Q801':'Israélienne','Q27':'Irlandaise','Q40':'Autrichienne','Q212':'Ukrainienne','Q414':'Argentine'};
async function bioWikidata(id){
 if(!/^\d+$/.test(String(id)))return null;
 const query=`SELECT ?person ?prop ?value ?valueLabel ?relativeTmdb WHERE {
  ?person wdt:P4985 "${id}" .
  VALUES ?prop { wdt:P27 wdt:P26 wdt:P40 wdt:P22 wdt:P25 wdt:P69 wdt:P856 wdt:P106 }
  ?person ?prop ?value .
  OPTIONAL { ?value wdt:P4985 ?relativeTmdb . }
  SERVICE wikibase:label { bd:serviceParam wikibase:language "fr,en". }
 } LIMIT 150`;
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),11000);
 try{
  const url='https://query.wikidata.org/sparql?format=json&query='+encodeURIComponent(query);
  const response=await fetch(url,{headers:{Accept:'application/sparql-results+json'},signal:controller.signal});
  if(!response.ok)throw Error('Wikidata indisponible');
  const json=await response.json();const result={};
  for(const row of json.results?.bindings||[]){
   const prop=row.prop?.value?.match(/P\d+$/)?.[0];if(!BIO_WIKIDATA_PROPS[prop])continue;
   const qid=row.value?.value?.match(/Q\d+$/)?.[0];
   let label=row.valueLabel?.value||row.value?.value;
   if(prop==='P27'&&qid&&BIO_NATIONALITES[qid])label=BIO_NATIONALITES[qid];
   if(!label||/^https?:\/\/www.wikidata.org\/entity\/Q\d+$/.test(label))continue;
   (result[prop]??=new Map()).set(label,{label,tmdb:row.relativeTmdb?.value||null});
  }
  return result;
 }finally{clearTimeout(timer)}
}
function bioAjouterWikidata(place,data){
 if(!data)return;
 for(const prop of ['P27','P26','P40','P22','P25','P69','P856']){
  const valeurs=[...(data[prop]?.values()||[])];if(!valeurs.length)continue;
  const line=document.createElement('p'),bold=document.createElement('strong');
  bold.textContent=BIO_WIKIDATA_PROPS[prop]+' : ';line.append(bold);
  valeurs.forEach((item,i)=>{
   if(i)line.append(document.createTextNode(' ; '));
   if(prop==='P856'){
    try{const url=new URL(item.label);if(!['https:','http:'].includes(url.protocol))throw Error();
     const link=document.createElement('a');link.href=url.href;link.target='_blank';link.rel='noopener noreferrer';link.textContent=item.label;link.className='bio-link';line.append(link);
    }catch(e){line.append(document.createTextNode(item.label))}
   }else if(['P26','P40','P22','P25'].includes(prop)&&/^\d+$/.test(String(item.tmdb||''))){
    const link=document.createElement('a');link.className='bio-link';link.textContent=item.label;
    const params=new URLSearchParams({personne:item.label,hall:'1',person_id:item.tmdb});
    link.href='index.html?'+params;line.append(link);
   }else line.append(document.createTextNode(item.label));
  });place.append(line);
 }
}

const actorDate=v=>{const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:(v||'Non renseignée')};
function actorSection(title){const sec=document.createElement('section');sec.className='actor-section';const h=document.createElement('h3');h.textContent=title;sec.append(h);actorContent.append(sec);return sec}
async function openActorDetail(person){
 actorContent.replaceChildren();const waiting=document.createElement('p');waiting.textContent='Chargement de la fiche…';actorContent.append(waiting);actorDialog.showModal();
 try{
  let id=person.id;
  if(!id){const words=person.name.trim().split(/\s+/),last=words.pop(),first=words.join(' ');const r=await fetch(PERSON_API+'/person-search?'+new URLSearchParams({first,last}));if(!r.ok)throw Error('Recherche indisponible');const d=await r.json();const matches=(d.people||[]).filter(x=>normalized(x.name)===normalized(person.name));if(matches.length!==1)throw Error('Identité ambiguë : impossible de choisir cet acteur avec certitude.');id=matches[0].id;person.id=id;}
  const r=await fetch(PERSON_API+'/person-detail?id='+encodeURIComponent(id));if(!r.ok)throw Error('Fiche indisponible');const p=await r.json();actorContent.replaceChildren();
  const profile=document.createElement('div');profile.className='actor-profile';const photo=document.createElement('div');if(p.profile_path||person.photo){const img=document.createElement('img');img.alt='Portrait de '+p.name;const path=p.profile_path||person.photo;img.src=String(path).startsWith('http')?path:'https://image.tmdb.org/t/p/w342'+path;photo.append(img)}else photo.textContent='Photographie indisponible';profile.append(photo);
  const facts=document.createElement('div');const h=document.createElement('h2');h.textContent=p.name||person.name;facts.append(h);const wikidataPlace=document.createElement('div');facts.append(wikidataPlace);
  for(const [label,value] of [['Naissance',p.birthday?actorDate(p.birthday):null],['Lieu de naissance',p.place_of_birth],['Décès',p.deathday?actorDate(p.deathday):null],['Profession',p.known_for_department==='Directing'?'Réalisation':p.known_for_department]])if(value){const line=document.createElement('p');const bold=document.createElement('strong');bold.textContent=label+' : ';line.append(bold,document.createTextNode(value));facts.append(line)}profile.append(facts);actorContent.append(profile);
   // Compléments Wikidata non bloquants : la fiche TMDB reste utilisable.
   bioWikidata(id).then(data=>{
    if(!data||!wikidataPlace.isConnected)return;
    bioAjouterWikidata(wikidataPlace,data);
   }).catch(()=>{});
  const biography=actorSection('BIOGRAPHIE');biography.classList.add('bio-readable');
  // Conserver le texte TMDB, ses paragraphes et ses sauts de ligne.
  // Si TMDB fournit un seul bloc très long, l'aérer entre les phrases sans modifier les mots.
  const rawBio=String(p.biography||'').trim()||'Biographie non disponible sur TMDB.';
  const sections=rawBio.split(/\n\s*\n/).flatMap(block=>{
   const lines=block.split(/\n/).map(x=>x.trim()).filter(Boolean);
   return lines.flatMap(line=>{
    if(line.length<550)return [line];
    const sentences=line.match(/[^.!?]+(?:[.!?]+(?=\s|$)|$)/g)||[line];
    const groups=[];let current='';
    for(const sentence of sentences){const part=sentence.trim();if(!part)continue;if(current&&current.length+part.length>440){groups.push(current);current=''}current+=(current?' ':'')+part}
    if(current)groups.push(current);return groups;
   });
  });
  for(const paragraph of sections){const bio=document.createElement('p');bio.textContent=paragraph;biography.append(bio)}
  const films=actorSection('FILMOGRAPHIE');const status=document.createElement('p');status.textContent='Chargement de la filmographie…';films.append(status);const grid=document.createElement('div');grid.className='actor-tickets';films.append(grid);
  try{const fr=await fetch(PERSON_API+'/filmography?'+new URLSearchParams({role:'director',id}));if(!fr.ok)throw Error('Filmographie indisponible');const data=await fr.json();if(!Array.isArray(data.credits))throw Error('Réponse incorrecte');status.textContent=data.credits.length+' films et séries';
   const localNames=new Set([...person.films].map(x=>normalized(x.split('|')[1])));
   for(const credit of data.credits){const ticket=document.createElement('div');ticket.className='actor-ticket';const year=document.createElement('span');year.className='actor-ticket-year';year.textContent=String(credit.date||'').slice(0,4)||'—';const name=document.createElement('strong');name.textContent=credit.title||credit.name||'Sans titre';ticket.append(year,name);if(credit.poster_path){const img=document.createElement('img');img.loading='lazy';img.alt='Affiche de '+name.textContent;img.src='https://image.tmdb.org/t/p/w154'+credit.poster_path;ticket.append(img)}else ticket.append(document.createElement('span'));if(localNames.has(normalized(name.textContent))){ticket.classList.add('present');const badge=document.createElement('small');badge.textContent='Dans notre vidéothèque';ticket.append(badge)}grid.append(ticket)}
  }catch(e){status.textContent=e.message}
 }catch(e){actorContent.replaceChildren();const error=document.createElement('p');error.textContent=e.message;actorContent.append(error)}
}

loadPortraits();
</script><script src="bandeau-mondial.js" defer></script></body></html>
